name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test:
    name: Node 测试与构建检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: 安装锁定依赖
        run: npm ci --engine-strict
      - name: 构建与静态检查
        run: npm run build
      - name: 运行无浏览器测试
        run: npm run test:node

      - name: 运行高保真仿真回归
        run: npm run test:sim

  browser-test:
    name: 浏览器测试 (Chrome headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: 安装锁定依赖
        run: npm ci --engine-strict

      - name: 读取 Puppeteer 锁定的 Chrome 版本
        id: browser-version
        run: |
          CHROME_BUILD="$(node -p "require('puppeteer-core').PUPPETEER_REVISIONS.chrome")"
          test -n "$CHROME_BUILD"
          echo "chrome=$CHROME_BUILD" >> "$GITHUB_OUTPUT"

      - name: 恢复锁定 Chrome 缓存
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/chrome
          key: chrome-${{ runner.os }}-${{ runner.arch }}-${{ steps.browser-version.outputs.chrome }}

      - name: 安装或复用锁定 Chrome
        id: chrome
        env:
          CHROME_BUILD: ${{ steps.browser-version.outputs.chrome }}
        run: |
          CHROME_PATH="$(./node_modules/.bin/browsers install "chrome@$CHROME_BUILD" --path "$RUNNER_TEMP/chrome" --format '{{path}}')"
          test -x "$CHROME_PATH"
          echo "Chrome: $CHROME_PATH"
          echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"

      - name: 运行浏览器测试
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.path }}
        run: npm run test:browser
