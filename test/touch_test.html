  window.__fullscreenRequests = 0;
  document.documentElement.requestFullscreen = function () {
    window.__fullscreenRequests++;
    return Promise.resolve();
  };
</script>
<script src="../js/main.js"></script>
<script>
  // 触控专项测试：runner 通过 evaluateOnNewDocument 注入 __FORCE_TOUCH__，
  // 用合成 PointerEvent 驱动摇杆/手势/按钮。直接打开本页（无注入）时跳过。
  window.Voxel = window.Voxel || {};
  (function () {
    if (!window.__FORCE_TOUCH__) {
      document.title = 'TOUCH-SKIP';
      return;
    }
  // 无头渲染桩
  THREE.WebGLRenderer.prototype.render = function () { };
  var doc = document;
  var out = [];
  var errCount = {};
  function check(name, cond) { out.push((cond ? 'ok   ' : 'FAIL ') + name); }
  function wait(ms, cb) { setTimeout(cb, ms); }
  function report() {
    var fail = out.filter(function (s) { return s.indexOf('FAIL') === 0; }).length;
    doc.getElementById('results').textContent =
      '=== ' + (fail === 0 ? 'TOUCH ALL PASS' : fail + ' FAILED') + ' ===\n' + out.join('\n');
    doc.title = fail === 0 ? 'TOUCH-PASS' : 'TOUCH-FAIL';
  }
  window.addEventListener('error', function (e) {
    out.push('PAGE_ERROR ' + e.message + ' @' + (e.lineno || '?'));
  });
  setInterval(function () {
    try { Voxel.Game._frame(performance.now()); }
    catch (e) {
      var k = e.message;
      errCount[k] = (errCount[k] || 0) + 1;
      if (errCount[k] === 1) out.push('FRAME_ERR ' + k);
    }
  }, 16);

  // 合成 PointerEvent（冒泡到 document 的 move/up 监听；down 绑在捕获层元素上）
  function pev(type, id, x, y, target) {
    var el = target || document.elementFromPoint(x, y) || doc.body;
    el.dispatchEvent(new PointerEvent(type, {
      bubbles: true, cancelable: true,
      pointerId: id, pointerType: 'touch', isPrimary: true,
      clientX: x, clientY: y, button: 0,
      buttons: (type === 'pointerup' || type === 'pointercancel') ? 0 : 1
    }));
  }
  // 世界坐标 → 屏幕像素（用于把手指放到指定方块上）
  function proj(wx, wy, wz) {
    var v = new THREE.Vector3(wx, wy, wz).project(Voxel.Game.camera);
    return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight };
  }

  check('触控模式已启用(?touch=1)', Voxel.Touch.enabled === true);

  // 1) 进入世界
  doc.getElementById('btn-new').click();
  var n = 0;
  (function poll() {
    if (Voxel.Game.state === 'playing') return stepA();
    if (++n > 900) { check('进入 playing 超时', false); return report(); }
    setTimeout(poll, 100);
  })();

  function stepA() {
    wait(400, function () {
      check('进入世界自动请求全屏', window.__fullscreenRequests >= 1);
      var cap = doc.querySelector('.touch-capture');
      check('捕获层已显示', !!cap && cap.style.display !== 'none' && cap.style.display !== '');
      var jb = doc.querySelector('.touch-btn-main');
      check('跳跃按钮已显示', !!jb && jb.style.display === 'flex');
      var db = doc.querySelector('.touch-btn-sub.descend');
      var fb = doc.querySelector('.touch-btn-sub.fly');
      var pb = doc.querySelector('.touch-btn-top.pause');
      var bb = doc.querySelector('.touch-btn-top.bag');
      var actions = [jb, db, fb, pb, bb];
      check('五个触控动作均为有名称的真实button', actions.every(function (el) {
        return !!el && el.tagName === 'BUTTON' && !!el.getAttribute('aria-label');
      }));
      check('摇杆与捕获层是辅助技术隐藏的装饰',
        cap.getAttribute('aria-hidden') === 'true' &&
        doc.querySelector('.touch-stick-base').getAttribute('aria-hidden') === 'true' &&
        doc.querySelector('.touch-stick-knob').getAttribute('aria-hidden') === 'true');
      check('飞行按钮初始aria-pressed=false', fb.getAttribute('aria-pressed') === 'false');

      // Rotate 使用与其余面板相同的modal栈；横屏resize与显式dismiss都精确返回。
      Voxel.Game.openRotateHint();
      wait(20, function () {
        check('rotate modal初焦继续按钮并冻结背景', Voxel.Game.state === 'rotate' &&
          doc.activeElement === doc.getElementById('btn-rotate-ok') && doc.getElementById('hud').inert === true);
        window.dispatchEvent(new Event('resize'));
        wait(20, function () {
          check('横屏自动关闭rotate并精确回playing', Voxel.Game.state === 'playing' &&
            doc.getElementById('rotate-hint').classList.contains('hidden'));
          Voxel.Game.openRotateHint();
          wait(20, function () {
            doc.getElementById('btn-rotate-ok').click();
            check('rotate显式dismiss关闭并记录本会话', Voxel.Game.state === 'playing' &&
              doc.getElementById('rotate-hint').classList.contains('hidden') &&
              sessionStorage.getItem('rh_dismissed') === '1');
            stepB();
          });
        });
      });
    });
  }

  // 2) 摇杆移动：左屏按下向右推 → 玩家 +x 位移；推满触发疾跑标志
  function stepB() {
    Voxel.Controls.setYaw(0);          // yaw=0 时摇杆右推 = 世界 +x
    Voxel.Controls.setPitch(-0.1);
    var p0 = Voxel.Player.pos().clone();
    var H = innerHeight;
    pev('pointerdown', 11, 90, H - 240);
    wait(60, function () {
      pev('pointermove', 11, 90 + 66 * 0.97, H - 240);   // 推满外圈 → 疾跑
      check('摇杆满推动量与疾跑标志', (function () {
        var sv = Voxel.Touch._test.stickVec();
        return sv.mag >= 0.9 && sv.sprint && Math.abs(sv.x - sv.mag) < 1e-6 && Math.abs(sv.y) < 1e-6;
      })());
      wait(700, function () {
        pev('pointerup', 11, 90 + 66, H - 240);
        wait(120, function () {
          var dx = Voxel.Player.pos().x - p0.x;
          var dz = Math.abs(Voxel.Player.pos().z - p0.z);
          check('摇杆右推玩家 +x 位移 (' + dx.toFixed(2) + ')', dx > 0.5);
          check('横移无串扰 (|Δz|=' + dz.toFixed(2) + ')', dz < 0.5);
          check('松手归零', Voxel.Touch.active() === false &&
            Voxel.Touch._test.stickVec().mag === 0);
          stepC();
        });
      });
    });
  }

  // 3) 右屏滑动转视角
  function stepC() {
    var pitch0 = Voxel.Controls.pitch();
    var W = innerWidth, H = innerHeight;
    pev('pointerdown', 12, W - 80, H / 2);
    var steps = 4;
    for (var i = 1; i <= steps; i++)
      pev('pointermove', 12, W - 80, H / 2 - i * 15);   // 上滑 60px → 抬头
    pev('pointerup', 12, W - 80, H / 2 - steps * 15);
    check('上滑抬头 (Δpitch=' + ((Voxel.Controls.pitch() - pitch0)).toFixed(3) + ')',
      Voxel.Controls.pitch() - pitch0 > 0.05);
    // 快速轻点不转视角（位移小于阈值）
    var pitch1 = Voxel.Controls.pitch();
    pev('pointerdown', 13, W - 60, H / 2);
    pev('pointerup', 13, W - 60, H / 2);
    check('轻点几乎不动视角', Math.abs(Voxel.Controls.pitch() - pitch1) < 0.01);
    stepD();
  }

  // 状态复位：确保 playing（关闭可能残留的面板）
  function ensurePlaying(cb) {
    (function closeLoop(n) {
      if (Voxel.Game.state === 'playing') { cb(); return; }
      if (n > 4) { cb(); return; }
      Voxel.Game.onKey('Escape');
      wait(120, function () { closeLoop(n + 1); });
    })(0);
  }

  // 把相机精确对准世界点并推帧应用；返回该点的屏幕坐标
  function aimAtWorld(wx, wy, wz) {
    var p = Voxel.Player.pos();
    var tx = wx - p.x, ty = wy - (p.y + 1.62), tz = wz - p.z;
    var hd = Math.sqrt(tx * tx + tz * tz);
    Voxel.Controls.setYaw(Math.atan2(-tx, -tz));
    Voxel.Controls.setPitch(Math.max(-1.5, Math.min(1.5, Math.atan2(ty, hd))));
    var tn = performance.now();
    for (var i = 0; i < 4; i++) Voxel.Game._frame(tn + 20 * (i + 1));
    var v = new THREE.Vector3(wx, wy, wz).project(Voxel.Game.camera);
    return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight };
  }

  // 4) 长按挖掘：复位站位；在多个候选格中挑选「投影在屏内且视线无遮挡」的目标
  var digTarget = null;   // {x,y,z,c}
  function stepD() {
    ensurePlaying(function () {
      var T = Voxel.Game._test;
      T.clearInv();
      // 清场：清掉现有生物并禁用生成，避免挡住触点射线（间歇性干扰源）
      var MC = Voxel.Config.MOB;
      MC.SHEEP_TARGET = 0; MC.PIG_TARGET = 0; MC.CHICKEN_TARGET = 0;
      MC.RABBIT_TARGET = 0; MC.ZOMBIE_TARGET = 0;
      Voxel.Mobs.clear();
      var sp = Voxel.World.spawnPoint();
      var gx = Math.floor(sp.x), gz = Math.floor(sp.z);
      var gy = Voxel.World.surfaceAt(gx, gz);
      Voxel.Player.init(new THREE.Vector3(gx + 0.5, gy + 1.02, gz + 0.5), 0, -0.3);
      wait(300, function () {
        var ex = gx + 0.5, ey = gy + 1.02 + 1.62, ez = gz + 0.5;
        var offs = [[0, -1], [0, -2], [1, -1], [-1, -1], [1, -2], [-1, -2], [0, -3], [2, -2], [-2, -2], [1, -3], [-1, -3]];
        var picked = null;
        for (var oi = 0; oi < offs.length && !picked; oi++) {
          var fx = gx + offs[oi][0], fz = gz + offs[oi][1];
          if (fx < 2 || fz < 2 || fx > 253 || fz > 253) continue;
          var fy = Voxel.World.surfaceAt(fx, fz);
          if (fy < 3 || fy > 58) continue;
          if (Math.abs(fy - gy) > 3) continue;   // 高差过大不选
          Voxel.World.set(fx, fy, fz, 2);        // 换成泥土（徒手 0.65s）
          var tx = fx + 0.5 - ex, ty = fy + 0.5 - ey, tz = fz + 0.5 - ez;
          var hd = Math.sqrt(tx * tx + tz * tz);
          if (hd < 0.8 || hd > 6) continue;      // 超出交互距离
          Voxel.Controls.setYaw(Math.atan2(-tx, -tz));
          Voxel.Controls.setPitch(Math.atan2(ty, hd));
          // 手动推几帧（递增时间戳保证跨过固定步长）把姿态写进相机
          var tnow = performance.now();
          for (var fi = 0; fi < 4; fi++) Voxel.Game._frame(tnow + 20 * (fi + 1));
          var v0 = new THREE.Vector3(fx + 0.5, fy + 0.5, fz + 0.5).project(Voxel.Game.camera);
          var cx = (v0.x + 1) / 2 * innerWidth, cy = (1 - v0.y) / 2 * innerHeight;
          if (!(cx > 30 && cx < innerWidth - 30 && cy > 30 && cy < innerHeight - 90)) continue;
          // 视线验证：从触点方向的射线必须首先命中这个泥土块
          var vv = new THREE.Vector3((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1, 0.5)
            .unproject(Voxel.Game.camera);
          vv.sub(Voxel.Game.camera.position).normalize();
          var hit = Voxel.Raycaster.cast(Voxel.Player.eyePos(), vv, 6);
          if (hit && hit.type === 'block' && hit.x === fx && hit.y === fy && hit.z === fz && hit.id === 2) {
            picked = { x: fx, y: fy, z: fz, c: { x: cx, y: cy } };
          }
        }
        if (!picked) { check('未找到视线通畅的挖掘目标', false); return stepE(); }
        digTarget = picked;
        check('选定挖掘目标 @' + picked.x + ',' + picked.y + ',' + picked.z +
          ' 屏内(' + picked.c.x.toFixed(0) + ',' + picked.c.y.toFixed(0) + ')', true);
        pev('pointerdown', 14, picked.c.x, picked.c.y);
        var tries = 0;
        (function pollDig() {
          tries++;
          if (Voxel.World.get(digTarget.x, digTarget.y, digTarget.z) === 0 ||
            tries >= 60) {
            // 手指抬起（否则 look 指针一直占用，后续轻点全部失效）
            pev('pointerup', 14, picked.c.x, picked.c.y);
            if (Voxel.World.get(digTarget.x, digTarget.y, digTarget.z) === 0) {
              check('长按挖掘破坏目标方块 (' + tries + '×200ms)', true);
              return wait(150, stepVisibilityReset);
            }
            check('长按挖掘超时未破坏', false);
            return stepE();
          }
          wait(200, pollDig);
        })();
      });
    });
  }

  // 后台切换必须释放已经触发的长按挖掘，且不能留下失联的 look 指针。
  function stepVisibilityReset() {
    var c = digTarget.c;
    pev('pointerdown', 40, c.x, c.y);
    wait(Voxel.Config.TOUCH.LONGPRESS_MS + 80, function () {
      check('后台切换前长按已进入挖掘态', Voxel.Game._test.digHeld());
      Object.defineProperty(doc, 'hidden', { value: true, configurable: true });
      doc.dispatchEvent(new Event('visibilitychange'));
      check('后台切换释放挖掘与手势状态',
        !Voxel.Game._test.digHeld() && !Voxel.Touch._test.lookActive());
      Object.defineProperty(doc, 'hidden', { value: false, configurable: true });
      wait(80, stepE);
    });
  }

  // 5) 轻点放置：往挖出的洞底面点一下，放入手持木板
  function stepE() {
    var T = Voxel.Game._test;
    T.inv()[0] = 10; T.cnt()[0] = 5;   // 木板 ×5 进快捷栏格 0（sel 默认 0）
    var t = digTarget;
    var c = aimAtWorld(t.x + 0.5, t.y + 0.02, t.z + 0.5);   // 洞底面中点
    pev('pointerdown', 15, c.x, c.y);
    pev('pointercancel', 15, c.x, c.y);
    wait(100, function () {
      check('pointercancel 不触发轻点放置',
        Voxel.World.get(t.x, t.y, t.z) === 0 && T.cnt()[0] === 5);
      pev('pointerdown', 16, c.x, c.y);
      pev('pointerup', 16, c.x, c.y);
      wait(250, function () {
        check('轻点放置木板入洞 (hole=' + Voxel.World.get(t.x, t.y, t.z) + ')',
          Voxel.World.get(t.x, t.y, t.z) === 10);
        check('放置消耗一格物品', T.cnt()[0] === 4);
        stepF();
      });
    });
  }

  // 6) 轻点交互：洞口上方摆工作台，轻点打开
  function stepF() {
    var t = digTarget;
    Voxel.World.set(t.x, t.y + 1, t.z, 15);
    wait(200, function () {
      var c = aimAtWorld(t.x + 0.5, t.y + 1.5, t.z + 0.5);   // 工作台中心
      pev('pointerdown', 16, c.x, c.y);
      pev('pointerup', 16, c.x, c.y);
      wait(250, function () {
        check('轻点工作台打开合成面板', Voxel.Game.state === 'crafting');
        var T = Voxel.Game._test;
        var plankBefore = T.countInv(10);
        T.setCraft(0, 10);
        doc.getElementById('btn-craft-close').click();
        check('工作台关闭按钮回到 playing', Voxel.Game.state === 'playing' &&
          doc.getElementById('crafting').classList.contains('hidden'));
        check('工作台关闭归还合成格材料', T.countInv(10) === plankBefore + 1);
        stepG();
      });
    });
  }

  // 7) 按钮：跳/飞/降/暂停/背包
  function stepG() {
    ensurePlaying(function () {
      var jb = doc.querySelector('.touch-btn-main');
      var fb = doc.querySelector('.touch-btn-sub.fly');
      var pb = doc.querySelector('.touch-btn-top.pause');
      var dbClick = doc.querySelector('.touch-btn-sub.descend');
      var bbClick = doc.querySelector('.touch-btn-top.bag');

      // 辅助技术通常只派发click；五个动作都必须有不依赖PointerEvent的后备路径。
      jb.click(); dbClick.click();
      check('跳跃/下降button click后备注入虚拟按键',
        Voxel.Controls.keys.Space === true && Voxel.Controls.keys.ShiftLeft === true);
      Voxel.Controls.keys.Space = false; Voxel.Controls.keys.ShiftLeft = false;
      fb.click(); Voxel.Touch.onFrame('playing');
      check('飞行button click切换并同步aria-pressed',
        Voxel.Player.flying() === true && fb.getAttribute('aria-pressed') === 'true');
      fb.click(); Voxel.Touch.onFrame('playing');
      pb.click();
      check('暂停button click走辅助技术后备路径', Voxel.Game.state === 'paused');
      doc.getElementById('btn-resume').click();
      Voxel.Controls.setPitch(1.4); // 避开刚交互过的工作台，确保E语义走背包而非方块交互
      bbClick.click();
      check('背包button click走辅助技术后备路径', Voxel.Game.state === 'inventory');
      doc.getElementById('btn-inv-close').click();

      pb.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 20, pointerType: 'touch' }));
      check('暂停按钮打开菜单', Voxel.Game.state === 'paused');
      var fs0 = window.__fullscreenRequests;
      doc.getElementById('btn-fullscreen').click();
      check('暂停菜单全屏按钮发起请求且保持暂停',
        window.__fullscreenRequests === fs0 + 1 && Voxel.Game.state === 'paused');
      doc.getElementById('btn-resume').click();
      check('恢复按钮自动请求全屏并回到 playing',
        window.__fullscreenRequests === fs0 + 2 && Voxel.Game.state === 'playing');

      fb.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 21, pointerType: 'touch' }));
      fb.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, pointerId: 21, pointerType: 'touch' }));
      check('飞行按钮切换飞行', Voxel.Player.flying() === true);
      wait(120, function () {
        var db = doc.querySelector('.touch-btn-sub.descend');
        check('飞行时显示下降按钮', db.style.display === 'flex');
        // 摇杆外圈允许快速平移，但不能复用为飞行下降输入。
        var H = innerHeight, fy0 = Voxel.Player.pos().y;
        pev('pointerdown', 41, 90, H - 240);
        pev('pointermove', 41, 156, H - 240);
        wait(250, function () {
          var wasSprint = Voxel.Touch._test.stickVec().sprint;
          pev('pointerup', 41, 156, H - 240);
          check('飞行摇杆外圈不触发下降',
            wasSprint && Math.abs(Voxel.Player.pos().y - fy0) < 0.05);

          db.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 22, pointerType: 'touch' }));
          check('下降键注入 ShiftLeft', Voxel.Controls.keys['ShiftLeft'] === true);
          db.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, pointerId: 22, pointerType: 'touch' }));
          check('松开清除 ShiftLeft', Voxel.Controls.keys['ShiftLeft'] === false);

          jb.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 23, pointerType: 'touch' }));
          check('跳跃键注入 Space', Voxel.Controls.keys['Space'] === true);
          jb.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, pointerId: 23, pointerType: 'touch' }));
          check('跳跃抬起清除 Space', Voxel.Controls.keys['Space'] === false);
          Voxel.Player.setFlying(false);

          var bb = doc.querySelector('.touch-btn-top.bag');
          aimAtWorld(Voxel.Player.pos().x, Voxel.Player.pos().y + 10, Voxel.Player.pos().z - 6); // 抬头看天
          bb.dataset.pre = Voxel.Game.state;
          bb.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 24, pointerType: 'touch' }));
          check('背包按钮打开背包 [pre=' + bb.dataset.pre + ']', Voxel.Game.state === 'inventory');
          doc.getElementById('btn-inv-close').click();
          check('背包关闭按钮回到 playing', Voxel.Game.state === 'playing' &&
            doc.getElementById('inventory').classList.contains('hidden'));
          bb.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 25, pointerType: 'touch' }));
          check('背包按钮再次打开背包', Voxel.Game.state === 'inventory');
          bb.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 25, pointerType: 'touch' }));
          check('再按关闭背包', Voxel.Game.state === 'playing');

          Voxel.Game.onKey('KeyE');   // 开背包验证捕获层隐藏
          wait(100, function () {
            var cap = doc.querySelector('.touch-capture');
            check('面板打开时捕获层隐藏', cap.style.display === 'none');
            Voxel.Game.onKey('KeyE');
            stepH();
          });
        });
      });
    });
  }

  // 8) 槽位 Pointer Events 点击拾取回归（与桌面共用同一代码路径）
  function stepH() {
    ensurePlaying(function () {
      var T = Voxel.Game._test;
      T.clearInv();
      T.inv()[0] = 10; T.cnt()[0] = 3;
      Voxel.Game.onKey('KeyE');   // 开背包
      var slotEl = doc.querySelector('#inv-grid [data-slot="inv:0"]');
      slotEl.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, button: 0, pointerId: 30 }));
      doc.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, button: 0, pointerId: 30 }));
      check('pointer 点击拾取到手持', T.held() === 10 && T.heldCount() === 3);
      doc.getElementById('btn-inv-close').click();
      check('背包关闭时手持物安全归还', Voxel.Game.state === 'playing' &&
        !T.held() && T.countInv(10) === 3);
      stepI();
    });
  }

  // 9) 所有容器/手册/设置都能靠可见按钮退出，且内容语义保持不变
  function stepI() {
    var T = Voxel.Game._test;
    var p = Voxel.Player.pos();
    var x = Math.max(2, Math.min(252, Math.floor(p.x) + 2));
    var y = Math.max(2, Math.min(61, Math.floor(p.y)));
    var z = Math.max(2, Math.min(252, Math.floor(p.z) + 2));

    Voxel.World.set(x, y, z, 37);
    T.openFurnaceAt(x, y, z);
    var furnaceState = T.furnaceState();
    if (furnaceState) furnaceState.in = { id: 3, n: 2 };
    doc.getElementById('btn-furnace-close').click();
    var savedFurnace = Voxel.World.getMeta(x, y, z);
    check('熔炉关闭按钮保留内容并回到 playing', Voxel.Game.state === 'playing' &&
      savedFurnace && savedFurnace.in && savedFurnace.in.n === 2);

    Voxel.World.set(x + 1, y, z, 38);
    T.openChestAt(x + 1, y, z);
    var chestState = T.curChest();
    if (chestState) chestState.items[0] = { id: 10, n: 2 };
    doc.getElementById('btn-chest-close').click();
    var savedChest = Voxel.World.getMeta(x + 1, y, z);
    check('箱子关闭按钮保留内容并回到 playing', Voxel.Game.state === 'playing' &&
      savedChest && savedChest.items[0] && savedChest.items[0].n === 2);

    Voxel.Game.openManual();
    check('合成手册已打开', !doc.getElementById('manual').classList.contains('hidden'));
    doc.getElementById('btn-manual-close').click();
    check('合成手册关闭按钮不改变 playing 状态', Voxel.Game.state === 'playing' &&
      doc.getElementById('manual').classList.contains('hidden'));

    Voxel.Game.onKey('KeyP');
    doc.getElementById('btn-settings').click();
    doc.getElementById('btn-settings-close').click();
    check('设置顶部关闭返回暂停菜单', Voxel.Game.state === 'paused' &&
      !doc.getElementById('overlay-pause').classList.contains('hidden'));
    doc.getElementById('btn-settings').click();
    doc.getElementById('btn-set-close').click();
    check('设置底部返回仍返回暂停菜单', Voxel.Game.state === 'paused' &&
      !doc.getElementById('overlay-pause').classList.contains('hidden'));
    Voxel.Game.onKey('KeyP');
    stepJ();
  }

  // 10) 全屏拒绝/不支持都必须安静降级，不能改变游戏状态
  function stepJ() {
    var T = Voxel.Game._test;
    var root = doc.documentElement;
    var originalRequest = root.requestFullscreen;
    var originalWebkit = root.webkitRequestFullscreen;
    root.requestFullscreen = function () { return Promise.reject(new Error('denied')); };
    T.requestFullscreen(true).then(function (ok) {
      check('全屏请求被拒绝时安全降级', ok === false && Voxel.Game.state === 'playing');
      root.requestFullscreen = null;
      root.webkitRequestFullscreen = null;
      return T.requestFullscreen(true);
    }).then(function (ok) {
      check('浏览器无全屏 API 时安全降级', ok === false && Voxel.Game.state === 'playing');
      root.requestFullscreen = originalRequest;
      root.webkitRequestFullscreen = originalWebkit;

      Voxel.Game.onKey('KeyP');
      doc.getElementById('btn-menu').click();
      doc.getElementById('btn-settings-menu').click();
      doc.getElementById('btn-settings-close').click();
      check('设置顶部关闭返回主菜单', Voxel.Game.state === 'menu' &&
        !doc.getElementById('overlay-start').classList.contains('hidden'));
      check('主循环无异常帧', Object.keys(errCount).length === 0);
      report();
    });
  }
})();
</script>
</body>
