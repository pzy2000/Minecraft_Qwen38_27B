<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SPACE-VISUAL-RUNNING</title>
<style>body{background:#08101e;color:#9ff;font:13px monospace}#out{white-space:pre-wrap}</style>
</head>
<body>
<div id="world-name"></div><div id="world-coord"></div><div id="warp-fuel"></div>
<div id="scan-terminal" aria-labelledby="scan-terminal-title" data-view="passive">
  <div id="scan-passive" aria-hidden="false"><span id="scan-terminal-title">扫描</span>
    <span id="scan-world"></span><span id="scan-position"></span>
    <span id="scan-biome"></span><span id="scan-environment"></span>
    <span id="scan-target"></span><span id="scan-distance"></span></div>
  <article id="arrival-card" class="hidden"><span id="arrival-kicker"></span>
    <strong id="arrival-world"></strong><span id="arrival-type"></span><span id="arrival-detail"></span></article>
</div>
<section id="starmap-cockpit" data-state="idle"><strong id="cockpit-selection"></strong>
  <button id="btn-travel-ignite" disabled aria-disabled="true">点火跃迁</button></section>
<div id="starmap-grid"></div><div id="starmap-status"></div>
<div id="overlay-warp" class="hidden" data-mode="ship" data-phase="ignition">
  <span id="warp-title"></span><span id="warp-origin"></span><span id="warp-destination"></span>
  <span id="warp-sub"></span><span id="warp-phase-code"></span><span id="warp-phase-label"></span>
  <div id="warp-progress"></div><span id="warp-eta"></span>
  <button id="btn-warp-skip">跳过演出</button><button id="btn-disembark" hidden disabled>下船</button>
</div>
<div id="travel-announcer"></div>
<pre id="out"></pre>

<script src="../vendor/three.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/world/seed.js"></script>
<script src="../js/world/universe.js"></script>
<script src="../js/world/galaxy.js"></script>
<script>
(function () {
  var activeKind = 'planet';
  var wet = false;
  var playerPos = new THREE.Vector3(128.5, 11.01, 128.5);
  var requestCount = 0, requestResult = true, setCalls = 0;
  var cells = Object.create(null), edits = Object.create(null), metadata = Object.create(null);
  function key(x, y, z) { return Math.floor(x) + ',' + Math.floor(y) + ',' + Math.floor(z); }
  function own(obj, name) { return Object.prototype.hasOwnProperty.call(obj, name); }
  Voxel.Blocks = { isSolid: function (id) { return id > 0 && id !== 7 && id !== 19; } };
  Voxel.World = {
    surfaceAt: function (x, z) {
      for (var y = 63; y >= 0; y--) if (Voxel.Blocks.isSolid(Voxel.World.get(x, y, z))) return y;
      return -1;
    },
    get: function (x, y, z) {
      var k = key(x, y, z);
      if (own(cells, k)) return cells[k];
      if (activeKind === 'station') return y === 23 ? 3 : 0;
      if (wet) return y === 5 ? 3 : (y > 5 && y <= Voxel.Config.WATER_LEVEL ? 7 : 0);
      return y === 10 ? 3 : 0;
    },
    set: function (x, y, z, id) { cells[key(x, y, z)] = id; edits[key(x, y, z)] = true; setCalls++; return true; },
    isEdited: function (x, y, z) { return !!edits[key(x, y, z)]; },
    getMeta: function (x, y, z) { return metadata[key(x, y, z)] || null; },
    setMeta: function (x, y, z, value) {
      var k = key(x, y, z);
      if (value) metadata[k] = value;
      else delete metadata[k];
    },
    spawnPoint: function () {
      return activeKind === 'station'
        ? new THREE.Vector3(128.5, 24.01, 128.5)
        : new THREE.Vector3(128.5, wet ? Voxel.Config.WATER_LEVEL + 2.01 : 11.01, 128.5);
    },
    biomeAt: function () { return 1; }
  };
  Voxel.Biomes = { name: function () { return '测试群系'; } };
  Voxel.Player = { pos: function () { return playerPos; } };
  Voxel.Controls = { touchMode: function () { return false; } };
  Voxel.DayNight = { isNight: function () { return false; } };
  Voxel.Weather = { label: function () { return '晴'; } };
  Voxel.Environment = { status: function () { return { hazard: 'none' }; } };
  Voxel.Game = { requestTravel: function () { requestCount++; return requestResult; } };
  window.__spaceVisualFixture = {
    setKind: function (kind) { activeKind = kind; wet = false; },
    setWet: function (value, reset) {
      wet = !!value; activeKind = 'planet';
      if (reset) { cells = Object.create(null); edits = Object.create(null); metadata = Object.create(null); setCalls = 0; }
    },
    markEdit: function (x, y, z, id) { cells[key(x, y, z)] = id; edits[key(x, y, z)] = true; },
    setNatural: function (x, y, z, id) { cells[key(x, y, z)] = id; },
    clearCells: function () { cells = Object.create(null); edits = Object.create(null); metadata = Object.create(null); setCalls = 0; },
    setRequestResult: function (value) { requestResult = !!value; },
    resetRequests: function () { requestCount = 0; },
    player: playerPos,
    requestCount: function () { return requestCount; },
    setCalls: function () { return setCalls; }
  };
})();
</script>
<script src="../js/systems/ship_flight.js"></script>
<script src="../js/ui/galaxy_map.js"></script>
<script src="../js/systems/space_travel.js"></script>
<script>
(function () {
  'use strict';
  var output = [], failed = 0;
  function check(name, ok, detail) {
    output.push((ok ? 'ok   ' : 'FAIL ') + name + (detail ? ' :: ' + detail : ''));
    if (!ok) failed++;
  }
  function allFinite(value) {
    if (typeof value === 'number') return isFinite(value);
    if (!value || typeof value !== 'object') return true;
    if (Array.isArray(value)) return value.every(allFinite);
    return Object.keys(value).every(function (key) { return allFinite(value[key]); });
  }
  function inside(bounds, point) {
    if (!bounds) return false;
    for (var i = 0; i < 3; i++)
      if (point[i] < bounds.min[i] || point[i] > bounds.max[i]) return false;
    return true;
  }
  function boundsIntersect(a, b) {
    return !!a && !!b && a.min[0] <= b.max[0] && a.max[0] >= b.min[0] &&
      a.min[1] <= b.max[1] && a.max[1] >= b.min[1] &&
      a.min[2] <= b.max[2] && a.max[2] >= b.min[2];
  }
  function portalGeometryOK(snapshot, anchor) {
    var list = snapshot.portals || [];
    for (var i = 0; i < list.length; i++) {
      var p = list[i], dx = anchor[0] - p.position[0], dz = anchor[2] - p.position[2];
      var length = Math.sqrt(dx * dx + dz * dz) || 1;
      var dot = Math.abs((p.normal[0] * dx + p.normal[2] * dz) / length);
      if (!allFinite(p) || dot < 0.85) return false;
      for (var r = 0; r < snapshot.reserved.length; r++)
        if (boundsIntersect(p.bounds, snapshot.reserved[r].bounds)) return false;
      for (var j = i + 1; j < list.length; j++) {
        var q = list[j], ddx = p.position[0] - q.position[0], ddz = p.position[2] - q.position[2];
        if (ddx * ddx + ddz * ddz < 64 || boundsIntersect(p.bounds, q.bounds)) return false;
      }
    }
    return true;
  }
  function roots(scene) {
    return scene.children.filter(function (obj) {
      return obj.userData && obj.userData.system === 'space-travel';
    });
  }
  function resourcesBalanced(stats) {
    return ['roots', 'geometries', 'materials', 'textures'].every(function (key) {
      return stats.created[key] - stats.disposed[key] === stats.live[key] && stats.live[key] >= 0;
    });
  }

  try {
    var fixture = window.__spaceVisualFixture;
    var S = Voxel.SpaceTravel;
    var selectedCalls = 0;
    Voxel.Game.selectTravelDestination = function (id) {
      selectedCalls++;
      return S.setSelectedDestination(id);
    };
    var scene = new THREE.Scene();
    var galaxy = Voxel.Galaxy.create('SPACE-VISUAL-FIXTURE');
    var planet = galaxy.catalog[0];
    var station = galaxy.catalog.filter(function (w) { return w.kind === 'station'; })[0];
    S.init(scene);

    fixture.setKind('planet');
    fixture.player.set(128.5, 11.01, 128.5);
    S.setVisualTime(10);
    S.loadWorld(planet, galaxy);
    S.update(0, 0);
    var planetSnap = S.visualSnapshot();
    var ship = S.ship();
    var toward = ship.position.clone().sub(fixture.player); toward.y = 0; toward.normalize();
    var forwardDot = toward.dot(new THREE.Vector3(0, 0, -1));
    check('默认yaw0的第一视锥前方生成飞船', ship.position.z < fixture.player.z - 4 && forwardDot > 0.7,
      'dot=' + forwardDot.toFixed(3) + ' z=' + ship.position.z.toFixed(1));
    ['ship-hull', 'ship-nose', 'ship-canopy', 'ship-wing', 'ship-tail', 'ship-landing-gear',
      'ship-engine', 'ship-engine-glow', 'ship-door', 'ship-ramp'].forEach(function (role) {
      check('飞船包含语义部件 ' + role, planetSnap.roles.indexOf(role) >= 0);
    });
    check('四起落架/双翼/双引擎辉光数量稳定',
      planetSnap.counts.byRole['ship-landing-gear'] === 4 &&
      planetSnap.counts.byRole['ship-wing'] === 2 &&
      planetSnap.counts.byRole['ship-engine-glow'] === 2);
    check('行星SpaceTravel对象预算有界', planetSnap.counts.drawables <= 40 &&
      planetSnap.counts.triangles <= 1000 && planetSnap.counts.geometries <= 40 &&
      planetSnap.counts.materials <= 40, JSON.stringify(planetSnap.counts));
    check('行星视觉快照全部数值有限且场景仅一个root', allFinite(planetSnap) && roots(scene).length === 1);
    check('A版行星网络四门双向字段完整', planetSnap.portals.length === 4 &&
      planetSnap.portals.every(function (p) {
        return !!p.id && !!p.destinationId && !!p.destinationGateId && !!p.pairId && !!p.slot && !!p.kind;
      }));
    check('行星最终门址间距/AABB/保留区/朝向全部安全',
      portalGeometryOK(planetSnap, fixture.player.toArray()));

    // outside→inside：失败请求也消费本次进入事件，必须离开扩大体积后才能重新触发。
    fixture.resetRequests(); fixture.setRequestResult(false);
    var firstPortal = S.portals()[0];
    fixture.player.set(firstPortal.position.x + 4, firstPortal.position.y, firstPortal.position.z);
    S.update(0, 0);
    fixture.player.set(firstPortal.position.x, firstPortal.position.y, firstPortal.position.z);
    S.update(0, 0);
    var rejectedOnce = fixture.requestCount(), rejectedSnap = S.visualSnapshot();
    S.update(0, 0);
    check('request=false后门保持未武装且不会每帧重试', rejectedOnce === 1 &&
      fixture.requestCount() === 1 && rejectedSnap.portals.every(function (p) { return !p.armed; }));
    check('靠近门提示安全目标名与免费传送', /传送门 → .+ · 接触后免费传送/.test(S.actionHint()));
    fixture.player.set(firstPortal.position.x + 2.1, firstPortal.position.y, firstPortal.position.z);
    S.update(0, 0);
    check('离开扩大迟滞体积后重新武装', S.visualSnapshot().portals.every(function (p) { return p.armed; }));
    fixture.player.set(firstPortal.position.x, firstPortal.position.y, firstPortal.position.z);
    S.update(0, 0);
    check('重新进入只触发第二次请求', fixture.requestCount() === 2);

    // 载入时若恢复在门内，不得靠计时自动触发；同样要求先离开再重入。
    S.loadWorld(planet, galaxy);
    firstPortal = S.portals()[0];
    fixture.player.set(firstPortal.position.x, firstPortal.position.y, firstPortal.position.z);
    S.loadWorld(planet, galaxy);
    S.update(99, 0);
    check('load恢复门内保持未武装且长时间不回跳', fixture.requestCount() === 2 &&
      S.visualSnapshot().portals.every(function (p) { return !p.armed; }));
    firstPortal = S.portals()[0];
    fixture.player.set(firstPortal.position.x + 2.1, firstPortal.position.y, firstPortal.position.z);
    S.update(0, 0);
    fixture.player.set(firstPortal.position.x, firstPortal.position.y, firstPortal.position.z);
    S.update(0, 0);
    check('load门内离开再进入后恰好触发', fixture.requestCount() === 3);
    fixture.setRequestResult(true); fixture.resetRequests();
    fixture.player.set(128.5, 11.01, 128.5);
    S.loadWorld(planet, galaxy);
    ship = S.ship();
    var boardPoint = new THREE.Vector3().fromArray(ship.userData.interactionLocal);
    ship.localToWorld(boardPoint);
    fixture.player.copy(boardPoint);
    S.update(.016, .016);
    S.boardShip();

    S.showMap();
    var destinationCard = document.querySelector('.star-card[data-destination-id="' + station.id + '"]');
    if (destinationCard) destinationCard.click();
    check('星图卡只选择航线而不直接requestTravel', !!destinationCard && selectedCalls === 1 &&
      fixture.requestCount() === 0 && destinationCard.getAttribute('aria-pressed') === 'true' &&
      !document.getElementById('btn-travel-ignite').disabled);
    S.showWarp(planet, station, 'ship', { mode: 'ship' });
    S.setFlightPhase('warp', 52, { mode: 'ship' });
    check('跃迁UI阶段/进度/路线同步', document.getElementById('overlay-warp').dataset.phase === 'warp' &&
      document.getElementById('overlay-warp').style.getPropertyValue('--warp-progress') === '52%' &&
      document.getElementById('warp-progress').getAttribute('aria-valuenow') === '52' &&
      document.getElementById('warp-destination').textContent.indexOf(station.name) >= 0);
    check('航行播报与下船接口可用', S.announceTravel('测试航行播报') &&
      document.getElementById('travel-announcer').textContent === '测试航行播报' &&
      S.setDisembarkReady(true) && !document.getElementById('btn-disembark').hidden);
    check('抵达卡/隐藏恢复PASSIVE', S.showArrival(planet, station, 'ship', { firstVisit: true, refueled: true }) &&
      document.getElementById('scan-terminal').dataset.view === 'arrival' &&
      document.getElementById('scan-passive').getAttribute('aria-hidden') === 'true' &&
      S.hideArrival() && document.getElementById('scan-terminal').dataset.view === 'passive' &&
      document.getElementById('scan-passive').getAttribute('aria-hidden') === 'false');
    S.hideWarp();

    S.disembarkShip({ silent: true });
    fixture.player.copy(ship.position);
    S.setVisualTime(10.5); S.update(0, 0);
    S.setVisualTime(11.0); S.update(0, 0);
    check('靠近飞船后舱门坡道按绝对时间展开', S.visualSnapshot().animation.rampProgress > 0.95);
    fixture.player.set(500, 20, 500);
    S.setReducedMotion(false);
    S.setVisualTime(2); S.update(0, 0); var movingA = S.visualSnapshot().animation;
    S.setVisualTime(3); S.update(0, 0); var movingB = S.visualSnapshot().animation;
    check('普通模式引擎/旋转环随绝对时间变化',
      movingA.engineOpacity !== movingB.engineOpacity ||
      JSON.stringify(movingA.ringRotations) !== JSON.stringify(movingB.ringRotations));
    S.setReducedMotion(true);
    S.setVisualTime(20); S.update(0, 0); var reducedA = S.visualSnapshot().animation;
    S.setVisualTime(200); S.update(0, 0); var reducedB = S.visualSnapshot().animation;
    check('减少动态模式不随绝对时间漂移',
      reducedA.engineOpacity === reducedB.engineOpacity &&
      reducedA.rampProgress === reducedB.rampProgress &&
      JSON.stringify(reducedA.ringRotations) === JSON.stringify(reducedB.ringRotations));

    // 旧算法失败形态：两门同坐标且落在ship目标点。resolver必须确定性移开全部冲突。
    var originalPortalsFor = Voxel.Galaxy.portalsFor;
    Voxel.Galaxy.portalsFor = function (g, w) {
      if (w && w.id === planet.id) return [
        { id: 'legacy-overlap-0', pairId: 'legacy-pair-0', destinationId: 'planet-1',
          destinationGateId: 'legacy-back-0', x: 128, z: 110, slot: 'legacy-0', kind: 'cycle' },
        { id: 'legacy-overlap-1', pairId: 'legacy-pair-1', destinationId: 'planet-2',
          destinationGateId: 'legacy-back-1', x: 128, z: 110, slot: 'legacy-1', kind: 'cycle' },
        { id: 'legacy-overlap-2', pairId: 'legacy-pair-2', destinationId: 'planet-3',
          destinationGateId: 'legacy-back-2', x: 130, z: 110, slot: 'legacy-2', kind: 'opposite' },
        { id: 'legacy-overlap-3', pairId: 'legacy-pair-3', destinationId: station.id,
          destinationGateId: 'legacy-back-3', x: 128, z: 110, slot: 'legacy-3', kind: 'station' }
      ];
      return originalPortalsFor(g, w);
    };
    fixture.setKind('planet'); fixture.player.set(128.5, 11.01, 128.5);
    S.loadWorld(planet, galaxy);
    var legacyResolved = S.visualSnapshot();
    check('旧同坐标/ship重叠形态被确定性解析为四个安全门址', legacyResolved.portals.length === 4 &&
      new Set(legacyResolved.portals.map(function (p) { return p.position.join(','); })).size === 4 &&
      portalGeometryOK(legacyResolved, fixture.player.toArray()));
    Voxel.Galaxy.portalsFor = originalPortalsFor;

    fixture.setKind('station');
    fixture.player.set(128.5, 24.001, 128.5);
    S.loadWorld(station, galaxy);
    S.update(0, 0);
    var stationSnap = S.visualSnapshot();
    var cameraPoint = [fixture.player.x, fixture.player.y + 1.62, fixture.player.z];
    check('空间站抵达玩家与相机均不在高hub包围盒内',
      !inside(stationSnap.station.hubBounds, fixture.player.toArray()) &&
      !inside(stationSnap.station.hubBounds, cameraPoint), JSON.stringify(stationSnap.station.hubBounds));
    check('真实航行终端位于出生点前方并写入快照', stationSnap.station.terminal[2] < 120 &&
      stationSnap.station.terminal.every(isFinite));
    ['station-terminal', 'station-terminal-screen', 'dock-beacon', 'dock-arch',
      'navigation-light', 'station-ring'].forEach(function (role) {
      check('空间站包含语义部件 ' + role, stationSnap.roles.indexOf(role) >= 0);
    });
    check('空间站六门网络与固定甲板pads完整', stationSnap.portals.length === 6 &&
      stationSnap.portals.every(function (p) { return !!p.pairId && !!p.destinationGateId; }) &&
      JSON.stringify(stationSnap.portals.map(function (p) { return [p.position[0], p.position[2]]; })) ===
        JSON.stringify([[104.5,128.5],[152.5,128.5],[108.5,144.5],[148.5,144.5],[116.5,152.5],[140.5,152.5]]));
    check('空间站六门间距/AABB/保留区/面向dock全部安全',
      portalGeometryOK(stationSnap, fixture.player.toArray()));
    check('空间站对象预算有界', stationSnap.counts.drawables <= 55 &&
      stationSnap.counts.triangles <= 1500 && stationSnap.counts.geometries <= 55 &&
      stationSnap.counts.materials <= 55, JSON.stringify(stationSnap.counts));
    var stationLandmark = S.scanLandmark();
    check('scanLandmark使用移动后的真实终端坐标', stationLandmark &&
      stationLandmark.kind === 'station-terminal' && stationLandmark.distance > 10 && stationLandmark.distance < 20,
      stationLandmark && stationLandmark.distance.toFixed(2));
    check('换世界释放旧root且资源账本守恒', roots(scene).length === 1 && resourcesBalanced(S.resourceStats()));

    // 全水面无干地：四个固定pad各自建立有限7×7甲板，重载不得重复写入。
    fixture.setWet(true, true); fixture.player.set(128.5, Voxel.Config.WATER_LEVEL + 2.01, 128.5);
    S.loadWorld(planet, galaxy);
    var oceanSnap = S.visualSnapshot(), firstPlatformWrites = fixture.setCalls();
    check('海洋无干地时四门全部使用确定性可走平台', oceanSnap.portals.length === 4 &&
      oceanSnap.portals.every(function (p) { return p.platform && p.position[1] === Voxel.Config.WATER_LEVEL + 2; }) &&
      portalGeometryOK(oceanSnap, fixture.player.toArray()) && firstPlatformWrites === 196,
      'writes=' + firstPlatformWrites);
    S.loadWorld(planet, galaxy);
    check('海洋平台保存式编辑重载幂等零追加写', fixture.setCalls() === firstPlatformWrites &&
      S.visualSnapshot().portals.every(function (p) { return p.platform; }));

    // 玩家编辑与功能块优先：不得覆盖原格，resolver必须选择另一个安全水面候选。
    fixture.setWet(true, true);
    fixture.markEdit(80, Voxel.Config.WATER_LEVEL + 1, 128, 38);
    fixture.player.set(128.5, Voxel.Config.WATER_LEVEL + 2.01, 128.5);
    S.loadWorld(planet, galaxy);
    var editedOcean = S.visualSnapshot();
    check('海洋平台不覆盖玩家edited功能块并移到安全候选',
      Voxel.World.get(80, Voxel.Config.WATER_LEVEL + 1, 128) === 38 && editedOcean.portals.length === 4 &&
      !(editedOcean.portals[0].position[0] === 80.5 && editedOcean.portals[0].position[2] === 128.5) &&
      portalGeometryOK(editedOcean, fixture.player.toArray()));

    // 形状相同也不能冒充系统平台：没有portal-platform meta的49格玩家石台必须避让。
    fixture.setWet(true, true);
    for (var ex = -3; ex <= 3; ex++) for (var ez = -3; ez <= 3; ez++)
      fixture.markEdit(80 + ex, Voxel.Config.WATER_LEVEL + 1, 128 + ez, 3);
    fixture.player.set(128.5, Voxel.Config.WATER_LEVEL + 2.01, 128.5);
    S.loadWorld(planet, galaxy);
    var playerPlatform = S.visualSnapshot();
    check('无系统meta的玩家7x7石台不被误认作portal平台', playerPlatform.portals.length === 4 &&
      !(playerPlatform.portals[0].position[0] === 80.5 && playerPlatform.portals[0].position[2] === 128.5));

    // 最终旋转门框可伸到中心±2.7格，±3边沿edited方块同样必须避让。
    fixture.clearCells(); fixture.setKind('planet');
    fixture.setNatural(80, 11, 131, 3);
    fixture.player.set(128.5, 11.01, 128.5);
    S.loadWorld(planet, galaxy);
    var edgeEdit = S.visualSnapshot();
    check('门框AABB边沿±3格自然实体障碍得到避让', edgeEdit.portals.length === 4 &&
      !(edgeEdit.portals[0].position[0] === 80.5 && edgeEdit.portals[0].position[2] === 128.5));
    fixture.clearCells(); fixture.setKind('planet');

    for (var cycle = 0; cycle < 20; cycle++) {
      var useStation = cycle % 2 === 1;
      fixture.setKind(useStation ? 'station' : 'planet');
      fixture.player.set(128.5, useStation ? 24.001 : 11.01, 128.5);
      S.loadWorld(useStation ? station : planet, galaxy);
      S.update(0, 0);
      var cycleSnap = S.visualSnapshot(), live = S.resourceStats();
      check('第' + (cycle + 1) + '次load单root/预算/账本', roots(scene).length === 1 &&
        cycleSnap.counts.drawables <= (useStation ? 55 : 40) &&
        cycleSnap.counts.triangles <= (useStation ? 1500 : 1000) && resourcesBalanced(live));
      S.clear();
      var cleared = S.resourceStats();
      check('第' + (cycle + 1) + '次clear唯一释放至零', roots(scene).length === 0 &&
        cleared.live.total === 0 && resourcesBalanced(cleared));
    }
    var finalStats = S.resourceStats();
    check('20次load/clear后created与disposed逐类相等',
      ['roots', 'geometries', 'materials', 'textures'].every(function (key) {
        return finalStats.created[key] === finalStats.disposed[key];
      }), JSON.stringify(finalStats));
    S.setVisualTime(null);
  } catch (error) {
    failed++;
    output.push('FAIL 未捕获异常 :: ' + (error && error.stack || error));
  }

  document.getElementById('out').textContent =
    '=== ' + (failed ? failed + ' FAILED' : 'ALL PASS') + ' ===\n' + output.join('\n');
  document.title = failed ? 'SPACE-VISUAL-FAIL' : 'SPACE-VISUAL-PASS';
})();
</script>
</body>
