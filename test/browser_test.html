<script>
// ---- 自动化测试：驱动真实游戏主循环 ----
(function () {
  // 测试中跳过实际 WebGL 渲染（软件渲染过慢）；GL 路径由 render_check.html 单独验证
  THREE.WebGLRenderer.prototype.render = function () { };
  var doc = document;
  var out = [];
  var finished = false;
  var glErrors = 0;
  var origErr = console.error;
  console.error = function () {
    var s = [].map.call(arguments, function (a) { return String(a); }).join(' ');
    if (/WebGL/i.test(s) && !/Performance/i.test(s)) glErrors++;
    origErr.apply(console, arguments);
  };
  function check(name, cond) { out.push((cond ? 'ok   ' : 'FAIL ') + name); }
  function wait(ms, cb) { setTimeout(cb, ms); }
  // 模拟真实鼠标拖拽：从 rect1 中心按下 → 移动 → 在 rect2 中心松开
  function dragTo(r1, r2) {
    function fire(type, x, y) {
      var el = document.elementFromPoint(x, y) || document;
      el.dispatchEvent(new PointerEvent(type, {
        bubbles: true, cancelable: true, button: 0,
        pointerId: 7, pointerType: 'mouse', isPrimary: true,
        clientX: x, clientY: y, view: window
      }));
    }
    var sx = r1.left + r1.width / 2, sy = r1.top + r1.height / 2;
    var dx = r2.left + r2.width / 2, dy = r2.top + r2.height / 2;
    fire('pointerdown', sx, sy);
    fire('pointermove', sx + (dx - sx) * 0.5, sy + (dy - sy) * 0.5);
    fire('pointermove', dx, dy);
    fire('pointerup', dx, dy);
  }
  function report() {
    if (finished) return;
    finished = true;
    check('WebGL 控制台无报错(' + glErrors + ' 条)', glErrors === 0);
    check('主循环无异常帧', Object.keys(errCount).length === 0);
    var fail = out.filter(function (s) { return s.indexOf('FAIL') === 0; }).length;
    doc.getElementById('results').textContent =
      '=== ' + (fail === 0 ? 'ALL PASS' : fail + ' FAILED') + ' ===\n' + out.join('\n');
    doc.title = fail === 0 ? 'TEST-PASS' : 'TEST-FAIL';
  }

  // 捕获页面级错误
  window.addEventListener('error', function (e) {
    out.push('FAIL PAGE_ERROR ' + e.message + ' @' + (e.lineno || '?'));
  });

  // 手动驱动游戏主循环（无头环境下 rAF 可能不推进）
  var errCount = {};
  setInterval(function () {
    try { Voxel.Game._frame(performance.now()); }
    catch (e) {
      var k = e.message;
      errCount[k] = (errCount[k] || 0) + 1;
      if (errCount[k] === 1) out.push('FRAME_ERR ' + k + '\n' + (e.stack || ''));
    }
  }, 16);

  // 1) 新世界 → 等待真实主循环进入 playing
  doc.getElementById('btn-new').click();
  var waitN = 0;
  (function poll() {
    if (Voxel.Game.state === 'playing') return stepB();
    if (waitN === 50) out.push('SNAP@5s state=' + Voxel.Game.state + ' ready=' + Voxel.World.isReady() + ' center=' + Voxel.World.centerMeshed() + ' prog=' + Voxel.World.progress().toFixed(2));
    if (waitN === 200) out.push('SNAP@20s state=' + Voxel.Game.state + ' ready=' + Voxel.World.isReady() + ' center=' + Voxel.World.centerMeshed() + ' prog=' + Voxel.World.progress().toFixed(2));
    if (++waitN > 900) { check('进入 playing 超时(state=' + Voxel.Game.state + ' ready=' + Voxel.World.isReady() + ' center=' + Voxel.World.centerMeshed() + ')', false); return report(); }
    setTimeout(poll, 100);
  })();

  function stepB() {
    check('世界已生成', Voxel.World.isReady());
    check('状态=playing', Voxel.Game.state === 'playing');

    // 帧率上限门控（_frame 直驱同样生效；同步执行无 harness 竞态）
    (function () {
      var T0 = Voxel.Game._test;
      Voxel.Settings.set('fpsCap', 30);
      var t0 = performance.now(), fc0 = T0.frameCount(), k;
      // 找到一个能放行的时间点（距上次执行 ≥33ms）
      for (k = 1; k <= 5; k++) { Voxel.Game._frame(t0 + k * 50); if (T0.frameCount() > fc0) break; }
      var fc1 = T0.frameCount();
      check('帧控：大间隔放行', fc1 === fc0 + 1);
      Voxel.Game._frame(t0 + k * 50 + 5);   // 仅 +5ms → 必须跳过
      check('帧控：间隔不足被跳过', T0.frameCount() === fc1);
      Voxel.Game._frame(t0 + k * 50 + 60);  // +60ms → 放行
      check('帧控：恢复放行', T0.frameCount() === fc1 + 1);
      Voxel.Settings.set('fpsCap', 0);
    })();
    check('出生点在地表', Voxel.Player.pos().y > 1 && Voxel.Player.pos().y < 63);

    // 无限世界合成回归：在仍受垂直碰撞约束的 y=63 飞过旧 x=256 边界。
    // 若 Physics 仍把 x>=WORLD_W 当作实体墙，玩家会卡在 255.7 左右；把玩家放到
    // WORLD_H 以上会绕过旧 cellTop 边界分支，形成假阳性，因此这里必须保持 y<H。
    (function () {
      var T = Voxel.World._test;
      var CS = Voxel.Config.CHUNK;
      var z = 128, y = Voxel.Config.WORLD_H - 1;
      var oldPos = Voxel.Player.pos().clone();
      var oldFly = Voxel.Player.flying();
      var oldYaw = Voxel.Controls.yaw(), oldPitch = Voxel.Controls.pitch();
      var oldRight = Voxel.Controls.keys.KeyD;
      var saved = [];
      var loaded = !!T && typeof Voxel.World.ensureChunk === 'function';
      if (loaded) Voxel.World.ensureChunk(T.floorDiv(256), T.floorDiv(z));
      for (var x = 250; loaded && x <= 272; x++) {
        saved.push([x, Voxel.World.get(x, y, z)]);
        Voxel.World.set(x, y, z, 0);
      }

      if (loaded) {
        Voxel.Player.init(new THREE.Vector3(253.5, y, z + 0.5), 0, 0);
        Voxel.Player.setFlying(true);
        Voxel.Controls.keys.KeyD = true; // yaw=0 时向右即 +X
        for (var fi = 0; fi < 90; fi++) Voxel.Player.update(1 / 60);
      }
      var crossedX = Voxel.Player.pos().x;
      var outsideSurface = loaded ? Voxel.World.surfaceAt(260, z) : -1;
      check('无限世界模块/外围区块已加载', loaded &&
        Voxel.World.isChunkLoaded(T.floorDiv(256), T.floorDiv(z)));
      check('飞行可越过旧 x=256 硬墙 (x=' + crossedX.toFixed(2) + ')', loaded && crossedX > 260);
      check('旧边界外 x=260 仍有真实地表 (y=' + outsideSurface + ')',
        loaded && outsideSurface >= 2 && outsideSurface < Voxel.Config.WORLD_H &&
        Voxel.Blocks.isSolid(Voxel.World.get(260, outsideSurface, z)));

      Voxel.Controls.keys.KeyD = oldRight;
      for (var si = 0; si < saved.length; si++) Voxel.World.set(saved[si][0], y, z, saved[si][1]);
      Voxel.Player.init(oldPos, oldYaw, oldPitch);
      Voxel.Player.setFlying(oldFly);
      Voxel.World.setFocus(oldPos.x, oldPos.z);
    })();

    // 音效冒烟：全部新增声音函数可调用且不抛异常（无头环境无实际出声）
    try {
      Voxel.Sound.step('grass'); Voxel.Sound.step('dirt'); Voxel.Sound.step('sand');
      Voxel.Sound.step('snow'); Voxel.Sound.step('stone'); Voxel.Sound.step('wood');
      Voxel.Sound.step('leaves'); Voxel.Sound.step('wool'); Voxel.Sound.step('glass');
      Voxel.Sound.dig('snow'); Voxel.Sound.place('snow'); Voxel.Sound.digTick('stone');
      Voxel.Sound.splash(0.5); Voxel.Sound.bubble(); Voxel.Sound.jump(); Voxel.Sound.land(0.6);
      Voxel.Sound.sheep(0.5); Voxel.Sound.sheepHurt(0.5); Voxel.Sound.zombie(0.5);
      Voxel.Sound.setUnderwater(true); Voxel.Sound.setUnderwater(false);
      var p0 = Voxel.Player.pos();
      check('音效函数可调用 + volAt 本位=1', Voxel.Sound.volAt(p0.x, p0.z) === 1 && Voxel.Sound.volAt(p0.x + 60, p0.z) === 0);
    } catch (e) {
      check('音效函数无异常 (' + e.message + ')', false);
    }
    wait(2500, stepC); // 让真实循环跑重力
  }

  function stepC() {
    check('玩家落地(重力+碰撞)', Voxel.Player.onGround());

    // 移动测试：飞行模式平移（随机地形下不受树木/坡度阻挡）
    Voxel.Controls.setYaw(0);
    Voxel.Player.setFlying(true);
    var z0 = Voxel.Player.pos().z;
    Voxel.Controls.keys['KeyW'] = true;
    wait(700, function () {
      Voxel.Controls.keys['KeyW'] = false;
      var moved = Math.abs(Voxel.Player.pos().z - z0);
      check('按住W键玩家移动 (位移 ' + moved.toFixed(2) + ')', moved > 0.5);
      Voxel.Player.setFlying(false); // 关飞行

      // 飞行后可能悬在低地/水面上空：放回出生点地表再测试（init 顺带重置 hp）
      var spg = Voxel.World.spawnPoint();
      var gy = Voxel.World.surfaceAt(Math.floor(spg.x), Math.floor(spg.z));
      Voxel.Player.init(new THREE.Vector3(spg.x, gy + 1.02, spg.z), 0.3, -1.5);
      wait(300, function () {
        runDigTests();
      });
    });
  }

  function runDigTests() {
    var doc = document;
    Voxel.Controls.setPitch(-1.5);
    Voxel.Controls.setYaw(0.3);
    var hit = Voxel.Raycaster.cast(Voxel.Player.eyePos(), Voxel.Player.lookDir(), 6);
    check('DDA 射线命中方块', !!hit && hit.type === 'block');
    if (hit && hit.type === 'block' && hit.id !== 12) {
      var old = Voxel.World.get(hit.x, hit.y, hit.z);
      Voxel.World.set(hit.x, hit.y, hit.z, 0);
      check('挖方块生效', Voxel.World.get(hit.x, hit.y, hit.z) === 0);
      check('增量 edits 已记录', Voxel.World.getEdits()[hit.x + ',' + hit.y + ',' + hit.z] === 0);
      Voxel.World.set(hit.x, hit.y, hit.z, old);
    }
    // 长按挖掘：裂纹覆盖层可见 + 进度推进
    Voxel.Controls.setPitch(-1.55); Voxel.Controls.setYaw(0);
    var mhit = Voxel.Raycaster.cast(Voxel.Player.eyePos(), Voxel.Player.lookDir(), 6);
    if (mhit && mhit.type === 'block' && mhit.id !== 12) {
      var mold = Voxel.World.get(mhit.x, mhit.y, mhit.z);
      Voxel.World.set(mhit.x, mhit.y, mhit.z, 3); // 换成石头：徒手 4 秒，足够观察进度
      // 站到旁边避免挖穿脚下导致坠落
      Voxel.Game._test.beginDig();
      wait(700, function () {
        var dp = Voxel.Game._test.digProgress();
        check('长按挖掘显示裂纹', Voxel.Game._test.crackVisible());
        // 无头软件渲染帧率低（固定步长每帧最多 5×1/60s），阈值放宽
        check('挖掘进度推进 (' + (dp.p || 0).toFixed(2) + 's)', (dp.p || 0) > 0.05 && dp.need > 2);
        Voxel.Game._test.endDig();
        check('松开后裂纹消失', !Voxel.Game._test.crackVisible());
        Voxel.World.set(mhit.x, mhit.y, mhit.z, mold);
        wait(1000, stepD);
      });
    } else {
      check('未找到可挖目标(脚下)', false);
      wait(1000, stepD);
    }
  }

  function stepD() {
    wait(8000, stepE); // 等生物自然生成（每 2 秒尝试一次）
  }

  function stepE() {
    check('生物已生成(数量 ' + Voxel.Mobs.count() + ')', Voxel.Mobs.count() > 0);
    if (Voxel.Mobs.count()) {
      var mob = Voxel.Mobs.list[0];
      Voxel.Mobs.damage(mob, 99, new THREE.Vector3(0, 1, 0));
      check('生物死亡被移除', Voxel.Mobs.list.indexOf(mob) === -1);
    }
    Voxel.DayNight.setTime(0.75); Voxel.DayNight.update(0.016);
    check('午夜判定为夜晚', Voxel.DayNight.isNight());
    Voxel.DayNight.setTime(0.3); Voxel.DayNight.update(0.016);
    check('上午判定为白天', !Voxel.DayNight.isNight());

    // 音频采样解码验证（unlock 时异步解码，此时应已完成）
    var dec = Voxel.Sound.decodedCount ? Voxel.Sound.decodedCount() : -1;
    check('音频采样已解码 (' + dec + ' 个)', dec >= 40);
    Voxel.Sound.setMusic('day'); Voxel.Sound.setMusic('night'); Voxel.Sound.setMusic('off');
    if (Voxel.Sound.spatial) {
      var sp = Voxel.Sound.spatial(Voxel.Player.pos().x + 5, Voxel.Player.pos().z);
      check('spatial 返回 vol/pan', typeof sp.vol === 'number' && sp.vol > 0 && sp.vol <= 1 && Math.abs(sp.pan) <= 1);
    }

    // 新增音效冒烟：猪/鸡/兔
    try {
      Voxel.Sound.pig(0.5); Voxel.Sound.pigHurt(0.5);
      Voxel.Sound.chicken(0.5); Voxel.Sound.chickenHurt(0.5);
      Voxel.Sound.rabbit(0.5); Voxel.Sound.rabbitHurt(0.5);
      check('猪/鸡/兔音效可调用', true);
    } catch (e) {
      check('猪/鸡/兔音效无异常 (' + e.message + ')', false);
    }

    // ---- 被动生物：受击逃跑 + 击杀掉落 ----

      Voxel.Mobs.damage(pig, 99, new THREE.Vector3(1, 0, 0));

    }
    var chk = Voxel.Mobs.spawn('chicken', mobPos);
    if (chk) Voxel.Mobs.damage(chk, 99, new THREE.Vector3(1, 0, 0));

    if (rbt) Voxel.Mobs.damage(rbt, 99, new THREE.Vector3(1, 0, 0));
    check('击杀鸡掉生鸡肉 / 兔掉生兔肉',
      Voxel.Game._test.countInv(111) >= 1 && Voxel.Game._test.countInv(113) >= 1);

    // 生物密度设置：降低后立即裁掉超额个体，后续生成目标也使用同一倍率。

    Voxel.Settings.set('mobDensity', 0.25);
    var pigN = Voxel.Mobs.list.filter(function (m) { return m.type === 'pig'; }).length;
    check('生物密度降低立即裁剪 (pig=' + pigN + ')',
      pigN === Voxel.Mobs._test.densityTarget('pig') && pigN === 1);
    Voxel.Settings.set('mobDensity', 1);

    // ---- 背包 UX：Shift 快搬 / 右键拆半堆 ----
    Voxel.Game._test.clearInv();
    var TI = Voxel.Game._test.inv(), TC = Voxel.Game._test.cnt();
    TI[0] = 10; TC[0] = 40;   // 40 木板放快捷栏格 0
    check('Shift 快搬执行成功', Voxel.Game._test.quickMoveInv(0));
    var movedBack = 0;
    for (var qm = 9; qm < 36; qm++) if (TI[qm] === 10) movedBack += TC[qm];
    check('快搬后源格清空且背包收全 (moved=' + movedBack + ')', TI[0] === 0 && movedBack === 40);
    var bi = -1;
    for (var fb = 9; fb < 36; fb++) if (TI[fb] === 10) { bi = fb; break; }
    var origN = TC[bi], expHalf = Math.ceil(origN / 2);

    check('右键拿取半堆 (half=' + expHalf + ')',

    // 把手上的半堆逐个放回另一空格（右键放置语义）
    var ei = -1;
    for (var fe = 0; fe < 36; fe++) if (!TI[fe]) { ei = fe; break; }
    var guardP = 0;
    while (Voxel.Game._test.held() && guardP++ < 80) Voxel.Game._test.slotRight('inv', ei);
    check('右键逐个放置放完整堆', !Voxel.Game._test.held() && TC[ei] === expHalf);
    check('拆开的两堆可重新合并(Shift)', (function () {
      Voxel.Game._test.quickMoveInv(ei);
      var tot = 0;
      for (var t = 0; t < 36; t++) if (TI[t] === 10) tot += TC[t];
      return tot === origN;
    })());

    // ---- Q 丢弃与拾取（确定性：轮询直至拾取或超时） ----
    Voxel.Game._test.clearInv();
    TI[0] = 3; TC[0] = 5;     // 石头 ×5
    var d0 = Voxel.Drops.count();
    Voxel.Game._test.throwSelected();
    check('Q 丢出掉落物实体且选中格减一',

    // B: 清场后在脚下精确放置一堆 → 轮询等待自动拾取（最多 ~4s）
    Voxel.Drops.clear();

    (function pollPickB(n) {
      var done = Voxel.Drops.count() === 0 && Voxel.Game._test.countInv(3) >= 6;
      if (done || n >= 14) {
        check('近距离掉落物自动拾取 (inv=' + Voxel.Game._test.countInv(3) + ' drops=' + Voxel.Drops.count() + ')', done);
        // C: 模拟抛物线丢出 → 玩家走到落点 → 轮询拾取
        var eyeC = Voxel.Player.eyePos();
        var lookC = Voxel.Player.lookDir();
        var dd = Voxel.Drops.spawn(3, 1, eyeC,
          new THREE.Vector3(lookC.x * 7, lookC.y * 7 + 2.5, lookC.z * 7));
        (function pollC1(k) {
          if (k >= 8 || dd.age > 0.9) {
            Voxel.Player.pos().set(dd.pos.x, dd.pos.y + 0.2, dd.pos.z);
            (function pollC2(j) {
              var done2 = Voxel.Drops.count() === 0 && Voxel.Game._test.countInv(3) >= 7;
              if (done2 || j >= 14) {
                check('走近后拾取被丢弃的物品 (drops=' + Voxel.Drops.count() + ' inv=' + Voxel.Game._test.countInv(3) + ')', done2);
                stepF();
              } else wait(300, function () { pollC2(j + 1); });
            })(0);
          } else wait(150, function () { pollC1(k + 1); });
        })(0);
      } else wait(300, function () { pollPickB(n + 1); });
    })(0);
  }

  function stepF() {

    var PL = Voxel.Player;

    PL.setFood(20);

        var c = document.getElementById('hunger');

      })());
      // 饥饿 0 → 缓慢扣血（轮询；低帧率下模拟时间变慢，预算放宽到 ~40s）
      PL.setFood(0); PL.setHp(5);
      (function pollStarve(n) {
        if (Voxel.Game.state !== 'playing') Voxel.Game.onKey('KeyP');
        if (Voxel.Player.hp() < 5 || n >= 130) {
          check('饥饿扣血生效 (hp=' + Voxel.Player.hp() + ')', Voxel.Player.hp() < 5 && Voxel.Player.hp() >= 1);
          PL.setFood(20); PL.setHp(20);

  function stepG() {
    var sp = Voxel.World.spawnPoint();
    var sx = Math.floor(sp.x), sy = Math.floor(sp.y + 1), sz = Math.floor(sp.z);
    var orig = Voxel.World.get(sx, sy, sz);
    Voxel.World.set(sx, sy, sz, 11);
    var invT = new Array(36).fill(0), cntT = new Array(36).fill(0);
    invT[0] = 10; cntT[0] = 64; invT[5] = 19; cntT[5] = 3;
    var durT = new Array(36).fill(null); durT[0] = 77;
    var ok = Voxel.Save.save(Voxel.World, {
      time: 0.42,
      weather: 'rain',
      player: { pos: [sp.x, sp.y, sp.z], yaw: 1.1, pitch: -0.2, fly: false, hp: 19 },
      inv: invT,
      cnt: cntT,
      held: 10,
      heldCnt: 64,
      bed: [sx, sy, sz],
      dur: durT
    });
    check('Save.save 成功', ok);
    var loaded = Voxel.Save.load();
    check('Save.load 往返一致', !!loaded && loaded.seed === Voxel.World.getSeed() && Math.abs(loaded.time - 0.42) < 1e-9);
    check('Save.load 完整字段往返',
      !!loaded && loaded.weather === 'rain' &&
      !!loaded.cnt && loaded.cnt[0] === 64 && loaded.cnt[5] === 3 && loaded.inv[5] === 19 &&
      loaded.held === 10 && loaded.heldCnt === 64 &&
      !!loaded.dur && loaded.dur[0] === 77 &&
      !!loaded.bed && loaded.bed[0] === sx && loaded.bed[1] === sy && loaded.bed[2] === sz);

    var seed = Voxel.World.getSeed();
    Voxel.World.clearMeshes(Voxel.Game.scene);
    Voxel.World.init(seed);
    while (!Voxel.World.isReady()) Voxel.World.generateNext(256);
    check('重新生成后为原值', Voxel.World.get(sx, sy, sz) === orig);
    Voxel.World.applyEdits(loaded.edits);
    check('applyEdits 还原修改', Voxel.World.get(sx, sy, sz) === 11);
    Voxel.World.set(sx, sy, sz, orig);
    var guard = 0;
    while (guard++ < 300 && Voxel.World.buildMeshes(16, Voxel.Game.scene) > 0) { }
    check('区块网格可重建', Voxel.World.centerMeshed());
    check('纹理图集 256x256', !!Voxel.Blocks.getAtlas() && Voxel.Blocks.getAtlas().width === 256);
    wait(1500, stepH); // 再跑一会渲染
  }

  function stepH() {
    // 光照冒烟：放置火把 → 邻格有块光；移除 → 熄灭
    // （stepG 直接调用 World.init 绕过了游戏加载流程，这里补一次初始化）
    if (!Voxel.World.lightReady()) Voxel.World.initLight();
    var spL = Voxel.World.spawnPoint();
    var bxL = Math.floor(spL.x), byL = Math.floor(spL.y + 1), bzL = Math.floor(spL.z);
    Voxel.World.set(bxL, byL, bzL, 19);
    check('光照已初始化', Voxel.World.lightReady());
    check('火把点亮邻格', Voxel.World.getBlk(bxL + 1, byL, bzL) > 0);
    Voxel.World.set(bxL, byL, bzL, 0);

    // 合成手册（12 条配方 + 烧炼章节）
    check('手册列出 13 条配方', document.querySelectorAll('#manual .recipe-row').length === 18);
    check('手册含材料获取与烧炼说明', document.querySelectorAll('#manual .manual-obtain').length >= 2);

    var T = Voxel.Game._test;
    T.clearInv();

    // 0) 手册一键合成：自动消耗背包材料，长按连续合成
    T.setInv(0, 4); T.setInv(1, 4); // 2 橡木
    Voxel.Game.onKey('KeyM');
    check('手册打开', !document.getElementById('manual').classList.contains('hidden'));
    var btn0 = document.querySelector('.craft-btn[data-recipe="0"]');
    check('合成按钮显示可合成次数 ×2', btn0.textContent === '合成 ×2' && btn0.disabled === false);
    check('工作台按钮材料不足(禁用)', document.querySelector('.craft-btn[data-recipe="1"]').disabled === true);
    btn0.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, button: 0, pointerId: 8 }));
    btn0.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, button: 0, pointerId: 8 }));
    check('一键合成: 1 橡木 → 4 木板', T.countInv(10) === 4 && T.countInv(4) === 1);
    check('合成按钮次数更新 ×1', document.querySelector('.craft-btn[data-recipe="0"]').textContent === '合成 ×1');

    // 长按连续合成
    T.clearInv();
    for (var mi = 0; mi < 3; mi++) T.setInv(mi, 4); // 3 橡木
    Voxel.Game.manualCraftStart(0);
    wait(700, function () {
      Voxel.Game.manualCraftStop();
      var planks = T.countInv(10);
      check('长按连续合成: 产出多份木板 (' + planks + ')', planks >= 8);
      wait(400, function () {
        check('松开后停止合成', T.countInv(10) === planks);
        Voxel.Game.onKey('KeyM');
        check('手册关闭', document.getElementById('manual').classList.contains('hidden'));

        // 1) 背包 2x2：橡木 → 木板 → 工作台（开局流程，解决"先有鸡还是先有蛋"）
        T.clearInv();
        T.setInv(0, 4); // 模拟砍树获得橡木
        Voxel.Game.onKey('KeyE'); // 开背包（准星未对准工作台）
        check('背包打开(state=inventory)', Voxel.Game.state === 'inventory' &&
          !document.getElementById('inventory').classList.contains('hidden'));

        // 1a) 拖拽：橡木 inv:0 → 2x2:0，再拖回 inv:5
        dragTo(document.querySelector('#inv-grid [data-slot="inv:0"]').getBoundingClientRect(),
          document.querySelector('[data-slot="icraft:0"]').getBoundingClientRect());
        check('拖拽: 橡木进入 2x2 格', T.invCraft()[0] === 4 && T.inv()[0] === 0);
        dragTo(document.querySelector('[data-slot="icraft:0"]').getBoundingClientRect(),
          document.querySelector('#inv-grid [data-slot="inv:5"]').getBoundingClientRect());
        check('拖拽: 橡木移回背包 inv:5', T.inv()[5] === 4 && T.invCraft()[0] === 0);

        // 1a1) 从快捷栏拖拽（面板打开时快捷栏浮在遮罩上）
        dragTo(document.querySelector('#hotbar [data-slot="inv:5"]').getBoundingClientRect(),
          document.querySelector('[data-slot="icraft:0"]').getBoundingClientRect());
        check('拖拽: 快捷栏橡木进入 2x2 格', T.invCraft()[0] === 4 && T.inv()[5] === 0);
        dragTo(document.querySelector('[data-slot="icraft:0"]').getBoundingClientRect(),
          document.querySelector('#inv-grid [data-slot="inv:5"]').getBoundingClientRect());
        check('拖拽: 快捷栏拖回背包', T.inv()[5] === 4 && T.invCraft()[0] === 0);

        Voxel.Game.onInvClick(5);

        dragTo(document.querySelector('[data-slot="icraft:0"]').getBoundingClientRect(),
          document.querySelector('[data-slot="inv:10"]').getBoundingClientRect());
        check('手持拖拽: 橡木放入 inv:10', T.inv()[10] === 4 && T.held() === 0);
        // 手持物品拖回空白处 = 继续手持
        Voxel.Game.onInvClick(10);

        var blankRect = { left: 10, top: 10, width: 10, height: 10 }; // 页面左上角空白
        dragTo(invRect, blankRect);
        check('手持拖拽: 丢空白处仍手持', T.held() === 4 && T.inv()[10] === 0);
        Voxel.Game.onInvClick(10); // 放回 inv:10（点击放置）

        // 1b) 点击拾取流程：inv:10 → 2x2 → 合成
        Voxel.Game.onInvClick(10);      // 拿起橡木
        Voxel.Game.onInvCraftClick(0);  // 放入 2x2
        var r = T.matchInvResult();
        check('2x2: 1 橡木 → 4 木板', !!r && r.result === 10 && r.count === 4);

  function stepI() {
    // 2) 工作台 3x3 合成
    var T = Voxel.Game._test;
    T.clearInv();

    // 打开工作台界面（游戏中对准工作台按 E 时走同一入口）

    T.setCraft(0, 4);

    T.clickResult();
    check('木板 x4 进入背包', T.countInv(10) === 4);

    T.setCraft(4, 10); T.setCraft(5, 10); T.setCraft(7, 10); T.setCraft(8, 10);
    r = T.matchResult();
    check('4 木板(2x2) → 工作台', !!r && r.result === 15 && r.count === 1);
    T.clickResult();
    check('工作台进入背包', T.countInv(15) === 1);

    // 3) 3 羊毛(上排) + 3 木板(下排) → 床
    T.setCraft(0, 16); T.setCraft(1, 16); T.setCraft(2, 16);
    T.setCraft(3, 10); T.setCraft(4, 10); T.setCraft(5, 10);
    r = T.matchResult();
    check('3 羊毛+3 木板 → 床', !!r && r.result === 17);
    T.clickResult();
    check('床进入背包', T.countInv(17) === 1);
    T.clearCraft();

    // 4) 顺序颠倒不应匹配
    T.setCraft(0, 10); T.setCraft(1, 10); T.setCraft(2, 10);
    T.setCraft(3, 16); T.setCraft(4, 16); T.setCraft(5, 16);
    check('床配方颠倒不匹配', !T.matchResult());
    T.clearCraft();

    // 5b) 工作台内合成熔炉（趁面板还开着）
    T.clearCraft();
    for (var fi2 = 0; fi2 < 9; fi2++) if (fi2 !== 4) T.setCraft(fi2, 3);
    var rf = T.matchResult();
    check('8 石头 → 熔炉(工作台)', !!rf && rf.result === 37);
    T.clickResult();
    check('熔炉进入背包', T.countInv(37) >= 1);

    // 5) 关闭工作台

    check('工作台界面关闭(state=playing)', Voxel.Game.state === 'playing' &&
      document.getElementById('crafting').classList.contains('hidden'));

    // 6) 熔炉：放置 → 打开 → 投料烧制 → 产出 → 破坏回收
    var spF = Voxel.World.spawnPoint();
    var fx = Math.floor(spF.x), fz = Math.floor(spF.z) + 2, fy = Voxel.World.surfaceAt(fx, fz) + 1;
    Voxel.World.set(fx, fy, fz, 37);
    T.openFurnaceAt(fx, fy, fz);
    check('熔炉面板打开(state=furnace)', Voxel.Game.state === 'furnace' &&
      !document.getElementById('furnace').classList.contains('hidden'));
    var fur = T.furnaceState();
    check('打开即创建炉子元数据', !!fur && fur.type === 'furnace' &&
      Voxel.World.getMeta(fx, fy, fz) === fur);

    // 投料：2 铁矿 + 1 煤炭（直接写入状态对象，UI 由 tick 同步）
    fur.in = { id: 9, n: 2 };
    fur.fuel = { id: 107, n: 1 };
    Voxel.FurnaceSys.tickOne(fur, 0.5);
    check('点火消耗煤炭', !fur.fuel && fur.burnT > 39);
    for (var tk = 0; tk < 10; tk++) Voxel.FurnaceSys.tickOne(fur, 0.5);   // 模拟推进 5s
    check('5 秒产出铁锭', !!fur.out && fur.out.id === 108 && fur.out.n === 1 && fur.in.n === 1);
    // UI 断言：直接调用渲染函数（与主循环 tickFurnaces 相同路径），避免依赖异步帧
    Voxel.HUD.setFurnace(fur);
    check('产物格 UI 渲染', (function () {
      var c = document.querySelector('#fur-out canvas');
      return !!c && c.getContext('2d').getImageData(22, 22, 1, 1).data[3] > 0;
    })());
    Voxel.FurnaceSys.tickOne(fur, 0.4);
    Voxel.HUD.setFurnaceGauges(
      fur.burnMax > 0 ? fur.burnT / fur.burnMax : 0,
      fur.prog / Voxel.FurnaceSys.SMELT_TIME);
    check('进度表针前进中', parseFloat(document.getElementById('fur-prog').style.width) > 0);

    // 关闭后炉子继续烧制（活跃表驱动）
    Voxel.Game.onKey('KeyE');
    check('熔炉面板关闭(state=playing)', Voxel.Game.state === 'playing' &&
      document.getElementById('furnace').classList.contains('hidden'));
    check('关闭后炉子仍在活跃表', T.activeFurnaceCount() >= 1 &&
      !!Voxel.World.getMeta(fx, fy, fz));

    // 破坏回收：内容退回背包 + 元数据清除
    fur.out = { id: 108, n: 1 };
    T.clearInv();
    T.dumpFurnace(fx, fy, fz);
    Voxel.World.set(fx, fy, fz, 0);
    check('破坏熔炉回收产出物', T.countInv(108) === 1);
    check('破坏后台账元数据已清空', !Voxel.World.getMeta(fx, fy, fz));

    // 7) 箱子：放置 → 打开 → Shift 存入（含工具耐久）→ 右键取半堆 → 破坏回收
    var cx2 = Math.floor(spF.x) + 4, cz2 = Math.floor(spF.z), cy2 = Voxel.World.surfaceAt(cx2, cz2) + 1;
    Voxel.World.set(cx2, cy2, cz2, 38);
    T.openChestAt(cx2, cy2, cz2);
    check('箱子面板打开(state=chest)', Voxel.Game.state === 'chest' &&
      !document.getElementById('chest').classList.contains('hidden'));
    var ch = T.curChest();
    check('打开即创建箱子元数据(27 格)', !!ch && ch.type === 'chest' && ch.items.length === 27);

    T.clearInv();
    T.addInv(10, 12);   // 木板 ×12 → slot0
    T.addInv(102, 1);   // 石镐 → slot1
    T.setDur(1, 50);    // 用过的镐
    T.quickMoveToChest(0);
    T.quickMoveToChest(1);
    check('Shift 快存后背包对应格清空', !T.inv()[0] && !T.inv()[1]);
    check('箱内木板整堆保存', !!ch.items[0] && ch.items[0].id === 10 && ch.items[0].n === 12);
    check('工具耐久保留入库', (function () {
      for (var i = 0; i < 27; i++) { var o = ch.items[i]; if (o && o.id === 102) return o.dur === 50; }
      return false;
    })());
    var plI = -1;
    for (var pi2 = 0; pi2 < 27; pi2++) if (ch.items[pi2] && ch.items[pi2].id === 10) { plI = pi2; break; }
    T.slotRight('chest', plI);
    check('右键从箱子取半堆', T.heldCount() === 6);
    T.closeChest();
    check('关闭后面板收起且手持物退回背包',
      Voxel.Game.state === 'playing' &&
      document.getElementById('chest').classList.contains('hidden') && T.countInv(10) >= 6);

    T.clearInv();   // 清空背包，验证破坏回收
    T.dumpChest(cx2, cy2, cz2);
    Voxel.World.set(cx2, cy2, cz2, 0);
    check('破坏箱子回收全部物品', T.countInv(10) === 6 && T.countInv(102) === 1);
    check('回收的镐耐久仍为 50', (function () {
      for (var i = 0; i < 36; i++) if (T.inv()[i] === 102) return T.durAt(i) === 50;
      return false;
    })());
    check('破坏箱子后台账元数据清空', !Voxel.World.getMeta(cx2, cy2, cz2));

    wait(500, stepJ);
  }

  function stepJ() {
    // 3) 击杀羊掉落羊毛
    var T = Voxel.Game._test;
    T.clearInv();
    Voxel.DayNight.setTime(0.3); Voxel.DayNight.update(0.016);
    function findSheep() {
      for (var i = 0; i < Voxel.Mobs.list.length; i++)
        if (Voxel.Mobs.list[i].type === 'sheep') return Voxel.Mobs.list[i];
      return null;
    }
    function killAndCheck() {
      var sheep = findSheep();
      if (!sheep) {
        check('羊生成(等待超时)', false);
        report();
        return;
      }
      Voxel.Mobs.damage(sheep, 99, new THREE.Vector3(0, 1, 0));
      wait(300, function () {
        check('击杀羊掉落羊毛 (获得 ' + T.countInv(16) + ')', T.countInv(16) >= 1);
        wait(1500, stepK);
      });
    }
    var sheep0 = findSheep();
    if (sheep0) killAndCheck();
    else wait(7000, killAndCheck); // 等自然生成（白天，每 2 秒尝试）
  }

  function stepK() {
    // 4) 半高床：网格几何 + 物理落地
    var sp = Voxel.World.spawnPoint();
    var bx = -1, bz = 0, by = 0;
    // 新地形较崎岖：在出生点周围螺旋扩大搜索两列同高的平整位置
    outer:
    for (var r = 2; r <= 24 && bx < 0; r++) {
      for (var dx = -r; dx <= r && bx < 0; dx++) {
        for (var dz = -r; dz <= r; dz++) {
          if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
          var cx = Math.floor(sp.x) + dx, cz = Math.floor(sp.z) + dz;
          var hy = Voxel.World.surfaceAt(cx, cz);
          if (hy > 5 && hy < 60 &&
              hy === Voxel.World.surfaceAt(cx + 1, cz) &&
              Voxel.World.get(cx, hy + 1, cz) === 0 &&
              Voxel.World.get(cx + 1, hy + 1, cz) === 0) {
            bx = cx; bz = cz; by = hy;
            break outer;
          }
        }
      }
    }
    check('找到平整测试位置', bx > 0);
    if (bx < 0) { wait(500, report); return; }

    Voxel.World.set(bx, by + 1, bz, 17);      // 床
    Voxel.World.set(bx + 1, by + 1, bz, 3);   // 床旁同层的整块石头
    var savedAbove = [Voxel.World.get(bx, by + 2, bz), Voxel.World.get(bx, by + 3, bz)];
    Voxel.World.set(bx, by + 2, bz, 0);      // 清空上方（供玩家传送/掉落）
    Voxel.World.set(bx, by + 3, bz, 0);
    for (var bld = 0; bld < 8; bld++) Voxel.World.buildMeshes(16, Voxel.Game.scene);

    // 收集所有不透明网格的 (x,y,z,u,v)
    var verts = [];
    Voxel.Game.scene.traverse(function (obj) {
      if (obj.isMesh && obj.geometry && obj.geometry.attributes && obj.geometry.attributes.position) {
        var p = obj.geometry.attributes.position.array;
        var u = obj.geometry.attributes.uv ? obj.geometry.attributes.uv.array : null;
        for (var i = 0; i < p.length; i += 3) {
          verts.push(p[i], p[i + 1], p[i + 2], u ? u[i / 3 * 2] : -1, u ? u[i / 3 * 2 + 1] : -1);
        }
      }
    });
    // 顶点存在性：x 贴平面、y 在范围内、z 贴方块角、v(纹理) 在范围内
    function hasV(x, yLo, yHi, vLo, vHi) {
      for (var i = 0; i < verts.length; i += 5) {
        if (Math.abs(verts[i] - x) > 0.05) continue;
        if (verts[i + 1] < yLo - 0.05 || verts[i + 1] > yHi + 0.05) continue;
        if (!(Math.abs(verts[i + 2] - bz) < 0.05 || Math.abs(verts[i + 2] - bz - 1) < 0.05)) continue;
        if (vLo !== undefined && (verts[i + 4] < vLo || verts[i + 4] > vHi)) continue;
        return true;
      }
      return false;
    }
    check('床侧面只到 y+0.5(上缘顶点存在)', hasV(bx, by + 1.5, by + 1.5) && hasV(bx, by + 1.0, by + 1.0));
    // 石头的 -X 面被分割：上半面的下缘顶点在 y+0.5 处、纹理 v 位于 tile 中部（≈0.9688）
    check('相邻石头面只发上半(y+0.5 处有中部纹理顶点)', hasV(bx + 1, by + 1.5, by + 1.5, 0.95, 0.99));
    // 若误发下半面，会在 y+1 处出现同样中部纹理 v 的顶点
    check('相邻石头面下半被剔除(防 z-fight)', !hasV(bx + 1, by + 1.0, by + 1.0, 0.955, 0.985));

    // 物理：玩家应落在床顶 (by+1.5) 而不是整格顶 (by+2)
    var bedTop = by + 1.5;
    Voxel.Player.init(new THREE.Vector3(bx + 0.5, bedTop + 1.2, bz + 0.5), 0, 0);
    // 轮询等待落地；headless 下指针锁异步失败可能触发 pause，恢复后再继续
    (function pollBed(n) {
      if (Voxel.Game.state !== 'playing') Voxel.Game.onKey('KeyP');
      if (!Voxel.Player.onGround() && n < 30) { wait(100, function () { pollBed(n + 1); }); return; }
      var py = Voxel.Player.pos().y;
      check('玩家站在床顶 (y=' + py.toFixed(2) + ' ≈ ' + bedTop + ' state=' + Voxel.Game.state + ')', Voxel.Player.onGround() && Math.abs(py - bedTop) < 0.15);
      // 恢复现场
      Voxel.World.set(bx, by + 1, bz, 0);
      Voxel.World.set(bx + 1, by + 1, bz, 0);
      Voxel.World.set(bx, by + 2, bz, savedAbove[0]);
      Voxel.World.set(bx, by + 3, bz, savedAbove[1]);
      for (var bld2 = 0; bld2 < 8; bld2++) Voxel.World.buildMeshes(16, Voxel.Game.scene);
      Voxel.Player.init(new THREE.Vector3(sp.x, Voxel.World.surfaceAt(Math.floor(sp.x), Math.floor(sp.z)) + 1.01, sp.z), 0, 0);
      wait(800, stepW);
    })(0);
  }

  function stepW() {
    // 5) 天气系统：雨/雷雨/闪电/雷击/彩虹/G 键切换
    var Wt = Voxel.Weather, g;
    check('初始天气为晴', Wt.stateName() === 'clear' && Wt.intensity() < 0.05);

    // 雨：设雨→强度爬升、雨滴可见、云变灰变密
    Wt.set('rain');
    g = 0;
    while (Wt.intensity() < 0.9 && g++ < 1000) Wt.update(0.1);
    check('雨强度爬升 (' + Wt.intensity().toFixed(2) + ')', Wt.intensity() > 0.9);
    check('雨滴可见', Wt.rainVisible());
    check('云变灰变密 (opacity ' + Wt.cloudOpacity().toFixed(2) + ')', Wt.cloudOpacity() > 0.7);

    // 雷暴 + 闪电
    Wt.set('storm');
    g = 0;
    while (Wt.intensity() < 0.9 && g++ < 1000) Wt.update(0.1);
    Wt._test.fireLightning();
    check('闪电触发闪屏', Wt.flash() > 0.3);
    // 手动驱动衰减，避免无头渲染帧率抖动导致时序偶发失败
    (function () {
      var gp = 0;
      while (Wt.flash() >= 0.3 && gp++ < 600) Wt.update(1 / 60);
    })();
    check('闪电屏闪衰减', Wt.flash() < 0.3);

    // 雷击：强制劈玩家掉血
    Voxel.Player.setHp(20);
    Wt._test.forceStrike();
      check('雷击使玩家掉血 (20→' + Voxel.Player.hp() + ')', Voxel.Player.hp() === 20 - Voxel.Config.WEATHER.STRIKE_DMG);
      Voxel.Player.heal(Voxel.Config.WEATHER.STRIKE_DMG);

      // 彩虹：雨停 + 太阳当空 → 出现；夜里不出现
      Voxel.DayNight.setTime(0.3); Voxel.DayNight.update(0.016);
      Wt.set('clear');
      g = 0;
      while (Wt.intensity() > 0.05 && g++ < 1000) Wt.update(0.1);
      Wt._test.triggerRainbow();
      g = 0;
      while (Wt.rainbowOpacity() < 0.25 && g++ < 200) Wt.update(0.25);
      check('白天雨后彩虹可见 (opacity ' + Wt.rainbowOpacity().toFixed(2) + ')', Wt.rainbowVisible() && Wt.rainbowOpacity() > 0.25);

      Voxel.DayNight.setTime(0.75); Voxel.DayNight.update(0.016);
      var n2 = 0;
      while (Wt.rainbowVisible() && n2++ < 400) Wt.update(0.25);
      check('夜里不出现彩虹', !Wt.rainbowVisible() && Wt.rainbowOpacity() === 0);

      // G 键手动切换（headless 下可能被指针锁失败暂停：先确保 playing）
      if (Voxel.Game.state !== 'playing') Voxel.Game.onKey('KeyP');
      Wt.set('clear');
      Voxel.Game.onKey('KeyG');
      check('G 键切换为雨', Wt.stateName() === 'rain');
      Voxel.Game.onKey('KeyG');
      check('G 键切换为雷雨', Wt.stateName() === 'storm');
      Wt.set('clear');
      wait(800, stepReset);
  }

  // P0 回归：新建/精选世界必须先确认并保护已有存档。
  function stepReset() {
    var T2 = Voxel.Game._test;
    T2.clearInv();
    T2.addInv(3, 5); // 背包塞 5 个石头

    var saveKey = Voxel.Config.SAVE_KEY;
    var backupKey = saveKey + '_backup';
    var protectedRaw = localStorage.getItem(saveKey);
    var backupBefore = localStorage.getItem(backupKey);
    var replace = doc.getElementById('overlay-world-replace');
    var cancel = doc.getElementById('btn-world-replace-cancel');
    var confirm = doc.getElementById('btn-world-replace-confirm');
    var stateBefore = Voxel.Game.state;
    check('新建保护测试已有主存档', typeof protectedRaw === 'string' && protectedRaw.length > 0);
    check('自定义确认对话框 DOM 齐全', !!replace && !!cancel && !!confirm);

    // 新世界：点击只能打开自定义确认，取消后主档必须保持字节级不变。
    doc.getElementById('btn-new').click();
    check('有存档时点击新世界显示自定义确认', !!replace && !replace.classList.contains('hidden'));
    check('确认对话框进入独立状态', Voxel.Game.state === 'world-replace');
    check('确认框显示时主档字节不变', localStorage.getItem(saveKey) === protectedRaw);
    Voxel.Game.onKey('Enter');
    check('确认框中 Enter 不能绕过确认开世界', Voxel.Game.state === 'world-replace' &&
      !replace.classList.contains('hidden') && localStorage.getItem(saveKey) === protectedRaw);
    cancel.click();
    check('取消新世界后关闭确认框', replace.classList.contains('hidden'));
    check('取消新世界后恢复原游戏状态', Voxel.Game.state === stateBefore);
    check('取消新世界后主档字节完全一致', localStorage.getItem(saveKey) === protectedRaw);
    check('取消新世界不改动备份槽', localStorage.getItem(backupKey) === backupBefore);

    // 精选世界使用同一条保护路径；取消后同样不能修改主档。
    var featuredBtn = doc.getElementById('btn-featured');
    if (featuredBtn && Voxel.Featured) {
      featuredBtn.click();
      var card = doc.querySelector('.featured-card');
      check('精选世界卡片已构建', !!card);
      if (card) card.click();
      check('有存档时点击精选卡显示确认', !replace.classList.contains('hidden') &&
        doc.getElementById('world-replace-title').textContent.indexOf('精选') >= 0 &&
        Voxel.Game.state === 'world-replace');
      check('精选世界未确认前主档不变', localStorage.getItem(saveKey) === protectedRaw);
      cancel.click();
      check('取消精选世界后恢复原游戏状态', Voxel.Game.state === stateBefore);
      check('取消精选世界后主档字节完全一致', localStorage.getItem(saveKey) === protectedRaw);
      doc.getElementById('btn-featured-back').click();
    } else {
      check('精选世界保护路径可测', false);
    }

    // 确认后才允许归档并开始创建。
    doc.getElementById('btn-new').click();
    check('再次新建仍要求确认', !replace.classList.contains('hidden'));
    confirm.click();
    check('确认后才进入 loading', Voxel.Game.state === 'loading');
    check('确认后旧主档精确进入备份槽', localStorage.getItem(backupKey) === protectedRaw && Voxel.Save.hasBackup());
    check('备份成功后才清空主档槽', localStorage.getItem(saveKey) === null);

    var n2 = 0;
    (function poll2() {
      if (Voxel.Game.state === 'playing') {
        check('新世界背包已清空', T2.countInv(3) === 0 && !T2.held());
        check('新世界进入后旧档仍可恢复', Voxel.Save.hasBackup() && localStorage.getItem(backupKey) === protectedRaw);
        var restoreBtn = doc.getElementById('btn-restore-backup');
        check('恢复上一存档按钮存在', !!restoreBtn);
        if (restoreBtn) restoreBtn.click();
        check('恢复按钮将旧档原始字节写回主槽', localStorage.getItem(saveKey) === protectedRaw);
        check('恢复后 Save.load 可读取原存档', !!Voxel.Save.load() &&
          Voxel.Save.load().seed === JSON.parse(protectedRaw).seed);
        report();
        return;
      }
      if (++n2 > 600) { check('新世界重载超时', false); report(); return; }
      setTimeout(poll2, 100);
    })();
  }

  setTimeout(function () {
    if (!finished) { check('测试在 240 秒内完成(state=' + Voxel.Game.state + ')', false); report(); }
  }, 240000);
})();
</script>
