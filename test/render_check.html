<script>
(function () {
  var out = [], glErr = 0;
  var origErr = console.error;
  console.error = function () {
    var s = [].map.call(arguments, function (a) { return String(a); }).join(' ');
    if (/WebGL|Shader|gl-|drawElements|buffer/.test(s) && !/Performance/.test(s)) { glErr++; if (glErr < 4) out.push('GL: ' + s.slice(0, 200)); }
    origErr.apply(console, arguments);
  };
  var canvas = document.getElementById('game');
  canvas.addEventListener('webglcontextlost', function () { out.push('GL: context lost!'); });
  // 固定种子：随机种子可能出生在海面/雪原，像素抽样会误判场景
  var siEl = document.getElementById('seed-input');
  if (siEl) siEl.value = '12345';
  document.getElementById('btn-new').click();
  var n = 0, playing = false, playedFrames = 0, sceneOk = false, uiOk = false;
  (function drive() {
    try {
      Voxel.Game._frame(performance.now());
      if (Voxel.Game.state === 'playing') { playing = true; playedFrames++; }
    } catch (e) { out.push('FRAME_ERR ' + e.message + ' ' + (e.stack || '').split('\n')[1]); }
    if (playedFrames >= 240) {
      out.push('state=' + Voxel.Game.state + ' playedFrames=' + playedFrames + ' glErrors=' + glErr);
      // 像素采样：验证画面里同时有天空和地形
      var c2 = document.createElement('canvas');
      c2.width = 320; c2.height = 200;
      var ctx2 = c2.getContext('2d');
      ctx2.drawImage(canvas, 0, 0, 320, 200);
      var d = ctx2.getImageData(0, 0, 320, 200).data;
      var counts = { sky: 0, green: 0, brown: 0, blue: 0, dark: 0, other: 0 };
      var sumR = 0, sumG = 0, sumB = 0, n = 0;
      for (var i = 0; i < d.length; i += 16) {
        var r = d[i], g = d[i+1], b = d[i+2];
        sumR += r; sumG += g; sumB += b; n++;
        if (b > 150 && b > r + 20 && g > 100) counts.sky++;
        else if (g > r + 15 && g > b + 15) counts.green++;
        else if (r > b + 15 && r >= g) counts.brown++;
        else if (r < 60 && g < 60 && b < 90) counts.dark++;
        else if (b > r + 30 && b >= g) counts.blue++;
        else counts.other++;
      }
      out.push('avg=rgb(' + (sumR/n|0) + ',' + (sumG/n|0) + ',' + (sumB/n|0) + ')');
      out.push('pixels: sky=' + counts.sky + ' green=' + counts.green + ' brown=' + counts.brown + ' water=' + counts.blue + ' dark=' + counts.dark + ' other=' + counts.other);
      sceneOk = counts.sky > 20 && (counts.green + counts.brown) > 20;
      out.push(sceneOk ? 'SCENE-LOOKS-CORRECT (天空+地形均可见)' : 'SCENE-SUSPICIOUS');

      var atlas = Voxel.Blocks.getTexture && Voxel.Blocks.getTexture().image;
      var atlasOk = !!(atlas && atlas.getContext), atlasHashes = {}, atlasRanges = [];
      if (atlasOk) {
        var atlasCtx = atlas.getContext('2d');
        [71, 72, 73, 74, 75, 76].forEach(function (tile) {
          var px = atlasCtx.getImageData((tile % 16) * 16, ((tile / 16) | 0) * 16, 16, 16).data;
          var hash = 2166136261, min = 255, max = 0;
          for (var ai = 0; ai < px.length; ai += 4) {
            for (var ac = 0; ac < 3; ac++) {
              hash ^= px[ai + ac]; hash = Math.imul(hash, 16777619) >>> 0;
              min = Math.min(min, px[ai + ac]); max = Math.max(max, px[ai + ac]);
            }
          }
          atlasHashes[hash] = true; atlasRanges.push(max - min);
        });
        atlasOk = Object.keys(atlasHashes).length === 6 && atlasRanges.every(function (range) { return range > 80; });
      }
      out.push(atlasOk ? 'PLANET-RESOURCE-TILES-DISTINCT' : 'PLANET-RESOURCE-TILES-FAIL');

      // 主动扫描/发现档案的生产 DOM 与样式也必须能随真实渲染 fixture 启动。
      function rect(el) {
        var r = el.getBoundingClientRect();
        return { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height };
      }
      function inside(r) {
        return r.left >= -0.5 && r.top >= -0.5 && r.right <= innerWidth + 0.5 && r.bottom <= innerHeight + 0.5;
      }
      function overlap(a, b) {
        return Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left)) *
          Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
      }
      var active = document.getElementById('scan-active-controls');
      var scanButton = document.getElementById('btn-scan-hud');
      var passive = document.getElementById('scan-terminal');
      var activeRect = rect(active), scanRect = rect(scanButton), passiveRect = rect(passive);
      var activeLayoutOk = inside(activeRect) && inside(scanRect) && scanRect.width >= 44 && scanRect.height >= 44 &&
        overlap(activeRect, passiveRect) === 0 &&
        getComputedStyle(passive).pointerEvents === 'none' &&
        !passive.querySelector('button,input,select,textarea,a,[tabindex]:not([tabindex="-1"])');
      var environmentModel = Voxel.HUD.setEnvironment({ hazard: 'toxic', exposure: 76, level: 'danger',
        active: true, protected: false, graceRemaining: 0, reason: '露天毒气' });
      var environmentMeter = document.getElementById('environment-meter');
      var environmentRect = rect(environmentMeter);
      var environmentLayoutOk = environmentModel.percent === 76 && inside(environmentRect) &&
        environmentMeter.getAttribute('aria-valuenow') === '76' &&
        overlap(environmentRect, passiveRect) === 0 && overlap(environmentRect, activeRect) === 0 &&
        document.documentElement.scrollWidth <= innerWidth + 1;

      var discoveryOverlay = document.getElementById('overlay-discovery');
      discoveryOverlay.classList.remove('hidden');
      var discoveryPanelRect = rect(discoveryOverlay.querySelector('.discovery-panel'));
      var discoveryCloseRect = rect(document.getElementById('btn-discovery-close'));
      var discoveryLayoutOk = inside(discoveryPanelRect) && inside(discoveryCloseRect) &&
        discoveryCloseRect.width >= 44 && discoveryCloseRect.height >= 44 &&
        document.documentElement.scrollWidth <= innerWidth + 1;
      discoveryOverlay.classList.add('hidden');

      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      active.dataset.state = 'sweeping';
      document.body.classList.add('scan-scanning');
      var pulseStyle = getComputedStyle(active, '::before');
      var sweepStyle = getComputedStyle(active, '::after');
      var progressStyle = getComputedStyle(document.querySelector('#scan-progress i'));
      var environmentStyle = getComputedStyle(environmentMeter);
      var environmentFillStyle = getComputedStyle(document.getElementById('environment-fill'));
      var motionOk = reduced
        ? pulseStyle.animationName === 'none' && sweepStyle.animationName === 'none' &&
          progressStyle.animationName === 'none' && parseFloat(pulseStyle.opacity) > 0
        : pulseStyle.animationName === 'activeScanPulse' && sweepStyle.animationName === 'activeScanSweep' &&
          progressStyle.animationName === 'activeScanFill' && Math.abs(parseFloat(pulseStyle.animationDuration) - 0.8) < 0.001;
      var environmentMotionOk = reduced
        ? environmentStyle.animationName === 'none' && parseFloat(environmentFillStyle.transitionDuration || '0') === 0
        : environmentStyle.animationName === 'environmentWarning' && Math.abs(parseFloat(environmentStyle.animationDuration) - 1.15) < 0.001;
      document.body.classList.remove('scan-scanning');
      active.dataset.state = 'idle';
      uiOk = atlasOk && activeLayoutOk && environmentLayoutOk && discoveryLayoutOk && motionOk && environmentMotionOk;
      out.push(activeLayoutOk ? 'SCAN-HUD-LAYOUT-CORRECT' : 'SCAN-HUD-LAYOUT-FAIL');
      out.push(environmentLayoutOk ? 'ENVIRONMENT-HUD-LAYOUT-CORRECT' : 'ENVIRONMENT-HUD-LAYOUT-FAIL');
      out.push(discoveryLayoutOk ? 'DISCOVERY-DIALOG-LAYOUT-CORRECT' : 'DISCOVERY-DIALOG-LAYOUT-FAIL');
      out.push(motionOk ? (reduced ? 'SCAN-REDUCED-MOTION-STATIC' : 'SCAN-MOTION-0.8S') : 'SCAN-MOTION-FAIL');
      out.push(environmentMotionOk ? (reduced ? 'ENVIRONMENT-REDUCED-MOTION-STATIC' : 'ENVIRONMENT-MOTION-1.15S') : 'ENVIRONMENT-MOTION-FAIL');
      document.getElementById('out').textContent = out.join('\n');
      document.title = (glErr === 0 && sceneOk && uiOk) ? 'RENDER-PASS' : 'RENDER-FAIL';
      return;
    }
    if (n++ > 6000) { out.push('TIMEOUT state=' + Voxel.Game.state); document.getElementById('out').textContent = out.join('\n'); document.title = 'RENDER-FAIL'; return; }
    setTimeout(drive, 16);
  })();
})();
</script>
